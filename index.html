try{const v2=localStorage.getItem(key),v1=localStorage.getItem('ezpz-v1');db=v2?normalize(JSON.parse(v2)):v1?normalize(JSON.parse(v1)):defaults()}catch(e){db=defaults();console.error('EZPZ saved data read error:',e);window.ezpzStartupDataError=true}let active=db.clients[0]?.id||null,tab='home',mode='A',draft={},editing=null,editClient=false;let ezpzSessionMeta={notes:'',effort:'',startedAt:null};const ezpzDraftKey=(id,m)=>'ezpz4-live-draft-'+String(id)+'-'+String(m);function ezpzPersistDraft(){if(!active)return;try{localStorage.setItem(ezpzDraftKey(active,mode),JSON.stringify({draft,meta:ezpzSessionMeta,savedAt:Date.now()}))}catch(e){}}function ezpzRestoreDraft(){draft={};ezpzSessionMeta={notes:'',effort:'',startedAt:Date.now()};try{const raw=localStorage.getItem(ezpzDraftKey(active,mode));if(raw){const data=JSON.parse(raw);if(data&&typeof data.draft==='object'&&data.draft&&!Array.isArray(data.draft))draft=data.draft;if(data&&data.meta&&typeof data.meta==='object')ezpzSessionMeta={notes:String(data.meta.notes||'').slice(0,1200),effort:String(data.meta.effort||''),startedAt:Number(data.meta.startedAt)||Date.now()}}}catch(e){}}if(active)ezpzRestoreDraft();const el=$('app');function save(){try{localStorage.setItem(key,JSON.stringify(db));return true}catch(e){alert('Storage failed. Export a backup and free up space.');return false}}if(!window.ezpzStartupDataError)save();function client(){return db.clients.find(c=>c.id===active)}function template(id){return db.templates.find(t=>t.id===id)}function setTab(t){ezpzRestStop();tab=t;document.querySelectorAll('[data-bottom]').forEach(b=>{const selected=b.dataset.bottom===t||t==='editor'&&b.dataset.bottom==='builder';b.classList.toggle('active',selected);b.setAttribute('aria-current',selected?'page':'false')});try{render()}catch(error){console.error('EZPZ navigation error:',t,error);el.innerHTML='<section class="ezpz-empty"><h2>Could not open '+esc(t)+'</h2><p>Try Home or reload the app. Your saved client records are unchanged. function ezpzExerciseTrends(sessions){const groups=new Map();for(const session of sessions.slice().sort((a,b)=>new Date(a.date)-new Date(b.date))){for(const e of session.entries||[]){if(!e.done)continue;const raw=String(e.weight??'').trim();if(!/^\d+(?:\.\d+)?$/.test(raw))continue;const weight=Number(raw);if(!Number.isFinite(weight)||weight<=0)continue;const name=String(e.name||'').trim(),unit=String(e.unit||'lb');if(!name)continue;const key=name+'|'+unit;if(!groups.has(key))groups.set(key,{name,unit,points:[]});groups.get(key).points.push({date:session.date,weight})}}const eligible=[...groups.values()].filter(x=>x.points.length>=2).sort((a,b)=>b.points.length-a.points.length||a.name.localeCompare(b.name)).slice(0,5);if(!eligible.length)return '<div class="ezpz-trend-empty">Log the same weighted exercise in at least two completed sessions to see its trend.</div>';return eligible.map(x=>{const points=x.points.slice(-8),first=points[0].weight,last=points[points.length-1].weight,diff=last-first,min=Math.min(...points.map(p=>p.weight)),max=Math.max(...points.map(p=>p.weight)),range=Math.max(1,max-min);const poly=points.map((p,i)=>((i/(points.length-1))*100).toFixed(2)+','+(35-((p.weight-min)/range)*29).toFixed(2)).join(' ');const delta=(diff>0?'+':'')+Number(diff.toFixed(2))+' '+esc(x.unit);return '<div class="ezpz-trend-item"><div class="ezpz-trend-header"><b>'+esc(x.name)+'</b><strong class="'+(diff>0?'up':diff<0?'down':'flat')+'">'+delta+'</strong></div><div class="ezpz-trend-values"><span>First '+first+' '+esc(x.unit)+'</span><span>Latest '+last+' '+esc(x.unit)+'</span></div><svg viewBox="0 0 100 40" preserveAspectRatio="none" role="img" aria-label="'+esc(x.name)+': weight from '+first+' to '+last+' '+esc(x.unit)+'"><path d="M0 35 H100" stroke="#47694f" stroke-width=".6" stroke-dasharray="2 3" fill="none"/><polyline points="'+poly+'" stroke="#a7f0bd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" fill="none"/></s function ezpzEditorLibraryMarkup(){return `<details class="ezpz-editor-library"><summary>+ Add from exercise library <span class="pill">${ezpzExerciseLibrary.length} movements</span></summary><p class="muted tiny">Search and tap any movement to insert it into this workout.</p><input id="ezpz-editor-ex-search" placeholder="⌕ Search movements..." aria-label="Search exercise library"><div class="ezpz-editor-library-grid">${ezpzExerciseLibrary.map(([name,category])=>`<button type="button" data-action="ezpz-insert-exercise" data-name="${esc(name)}" data-editor-search="${esc((name+' '+category).toLowerCase())}"><b>${esc(name)}</b><small>${esc(category)}</small><span>+</span></button>`).join('')}</div><p id="ezpz-editor-no-match" class="muted tiny" hidden>No matching movements.</p></details>`}

function editorAction(a,id){const w=editTarget();if(!w)return;syncEditor();if(a==='add-ex')w.exercises.push({id:uid(),name:'New exercise',sets:3,reps:'10',rest:60,unit:'lb'});if(a==='remove-ex'){if(!confirm('Remove this exercise?'))return;w.exercises=w.exercises.filter(e=>e.id!==id)}if(a==='move-up'||a==='move-down'){const i=w.exercises.findIndex(e=>e.id===id),j=i+(a==='move-up'?-1:1);if(j>=0&&j<w.exercises.length)[w.exercises[i],w.exercises[j]]=[w.exercises[j],w.exercises[i]]}if(a==='reset-client'){if(!confirm('Replace this client workout with the current standard template?'))return;delete client().customWorkouts[mode];editing=null;save();setTab('train');return}if(a==='save-editor'){if(w.exercises.some(e=>!e.name.trim()))return alert('Give every exercise a name');if(editing?.scope==='template')w.updatedAt=Date.now();save();editing=null;setTab(editClient?'train':'builder');return}if(a==='back-editor'){if(editing?.scope==='template')w.updatedAt=Date.now();save();editing=null;setTab(editClient?'train':'builder');return}renderEditor()}

esc(e.reps||'—')} reps ${e.done?'· ✓ Complete':''}</div>${e.notes?`<p class="ezpz-history-coach-note">${esc(e.notes)}</p>`:''}</div></div>`).join('')}</div></details></section>`).join('')||'<div class="ezpz-empty"><h3>No saved sessions</h3><p>Complete a workout to see it here.</p></div>'}</div><p id="ezpz-history-empty" class="muted" hidden>No sessions match those filters.</p>`}
function ezpzFilterHistory(){const q=(document.getElementById('ezpz-history-search')?.value||'').trim().toLowerCase();const code=document.getElementById('ezpz-history-client')?.value||'',modeFilter=document.getElementById('ezpz-history-mode')?.value||'';const paymentFilter=document.getElementById('ezpz-history-payment')?.value||'';let shown=0;el.querySelectorAll('[data-history-code]').forEach(card=>{const ok=(!code||card.dataset.historyCode===code)&&(!modeFilter||card.dataset.historyMode===modeFilter)&&(!paymentFilter||card.dataset.historyPayment===paymentFilter)&&(!q||card.dataset.historySearch.includes(q));card.hidden=!ok;if(ok)shown++});const count=document.getElementById('ezpz-history-visible-count');if(count)count.textContent=shown+' sessions shown';const empty=document.getElementById('ezpz-history-empty');if(empty)empty.hidden=shown>0||db.sessions.length===0}
function renderBackup(){let bytes=0;try{bytes=new Blob([JSON.stringify(db)]).size}catch(e){}const last=localStorage.getItem('ezpz4-last-export');el.innerHTML=`<div class="ezpz-page-head"><div class="ezpz-page-eyebrow">YOUR DATA</div><h2>Backup & restore</h2><p class="muted">Keep a copy of your coaching records.</p></div><div class="ezpz-backup-grid"><div><span>CLIENTS</span><strong>${db.clients.length}</strong></div><div><span>SESSIONS</span><strong>${db.sessions.length}</strong></div><div><span>TEMPLATES</span><strong>${db.templates.length}</strong></div></div><section class="ezpz-backup-hero"><div class="ezpz-section-kicker">LOCAL STORAGE</div><h3>Your data stays on this device</h3><p class="muted">This app saves records in this browser, not in a cloud account. Download a backup before changing phones or clearing browser data.</p><div class="ezpz-backup-status"><span>● Browser storage</span><b>Active</b></div><div class="ezpz-backup-status"><span>Last export on this device</span><b>${last?new Date(last).toLocaleDateString():'Not recorded'}</b></div><div class="ezpz-backup-status"><span>Approx. backup size</span><b>${(bytes/1024).toFixed(1)} KB</b></div><button class="primary" data-action="backup">↓ Download complete backup</button></section><section class="stack"><div class="ezpz-section-kicker">TRANSFER OR RESTORE</div><h3>Restore a backup</h3><p class="muted tiny">Choose a trusted EZPZ JSON backup. Restoring replaces the current clients, sessions and templates.</p><label>Choose backup file<input id="restore-file" type="file" accept="application/json,.json"></label><p class="danger tiny">Export your current records before restoring. Storage is not encrypted; avoid sensitive client information.</p></section><section class="ezpz-export-panel"><h3>Export session spreadsheet</h3><p class="muted tiny">Download a CSV summary of logged workouts for your own records.</p><button data-action="export-csv">↓ Download session CSV</button></section>`}
function ezpzDownload(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function ezpzExportCSV(){const clean=v=>{const str=String(v??'');const safe=/^[=+@\-\t\r]/.test(str)?'\''+str:str;return '"'+safe.replace(/"/g,'""')+'"'};const rows=[['Date','Client code','Week','Workout','Exercise','Sets','Weight','Unit','Reps','Completed']];for(const s of db.sessions||[])for(const e of s.entries||[])rows.push([s.date,s.code,s.week,s.workoutName||s.mode,e.name,e.sets,e.weight,e.unit,e.reps,e.done?'Yes':'No']);ezpzDownload('ezpz-sessions-'+new Date().toISOString().slice(0,10)+'.csv',rows.map(row=>row.map(clean).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function ezpzRecords(){const map=new Map();for(const session of db.sessions||[]){for(const e of session.entries||[]){if(!e.done)continue;const weight=Number(String(e.weight||'').trim());if(!Number.isFinite(weight)||weight<=0||!e.name)continue;const key=String(session.clientId)+'|'+String(e.name).toLowerCase()+'|'+String(e.unit||'lb');const prev=map.get(key);if(!prev||weight>prev.weight)map.set(key,{client:session.code,name:e.name,weight,unit:e.unit||'lb',date:session.date})}}return [...map.values()].sort((a,b)=>b.weight-a.weight)}
function ezpzWeeklyVolume(){const out=[];for(let i=5;i>=0;i--){const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-start.getDay()-i*7);const end=new Date(start);end.setDate(end.getDate()+7);const count=(db.sessions||[]).filter(s=>{const d=new Date(s.date);return d>=start&&d<end}).length;out.push({label:start.toLocaleDateString(undefined,{month:'short',day:'numeric'}),count})}return out}

function ezpzClientLast(c){const sessions=db.sessions.filter(s=>s.clientId===c.id);return sessions.length?sessions.reduce((latest,s)=>!latest||new Date(s.date)>new Date(latest.date)?s:latest,null):null}
function ezpzTrainerRoster(){const q=(document.getElementById('ezpz-home-search')?.value||'').trim().toLowerCase();const filter=document.getElementById('ezpz-home-filter')?.value||'all';const today=ezpzLocalDate(new Date());let list=db.clients.map(c=>({c,last:ezpzClientLast(c)}));if(filter==='today')list=list.filter(x=>x.c.nextSession?.slice(0,10)===today);else if(filter==='untrained')list=list.filter(x=>!x.last);else if(filter==='inactive')list=list.filter(x=>x.last&&(Date.now()-new Date(x.last.date).getTime())>14*864e5);list=list.filter(x=>x.c.code.toLowerCase().includes(q));list.sort((a,b)=>{const ax=a.c.nextSession||'9999',bx=b.c.nextSession||'9999';return ax.localeCompare(bx)||a.c.code.localeCompare(b.c.code)});return list}
