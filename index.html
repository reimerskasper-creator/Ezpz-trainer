function renderHistory(){const all=db.sessions.slice().reverse(),codes=[...new Set(all.map(s=>s.code))].sort();el.innerHTML=`<div class="ezpz-page-head"><div class="ezpz-page-eyebrow">THE WORK YOU PUT IN</div><h2>Session history <span class="pill">${all.length}</span></h2><p class="muted">A record of every saved workout.</p></div><div class="ezpz-history-summary"><div><b>${all.length}</b><small>Sessions</small></div><div><b>${all.reduce((n,s)=>n+(s.entries||[]).filter(e=>e.done).length,0)}</b><small>Exercises done</small></div><div><b>${new Set(all.map(s=>String(s.date||'').slice(0,10))).size}</b><small>Training days</small></div></div><div class="ezpz-history-filters"><label>Client<select id="ezpz-history-client"><option value="">All clients</option>${codes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></label><label>Workout<select id="ezpz-history-mode"><option value="">All workouts</option><option value="A">Workout A</option><option value="B">Workout B</option></select></label></div><div id="ezpz-history-results">${all.map(s=>`<section class="ezpz-history-card" data-history-code="${esc(s.code)}" data-history-mode="${esc(s.mode||'')}"><details><summary><div><b>${esc(s.code)} · ${esc(s.workoutName||s.mode)}</b><div class="muted tiny">Week ${esc(s.week)} · ${new Date(s.date).toLocaleString()}</div></div><span class="ezpz-chevron">⌄</span></summary><div class="ezpz-history-entries">${(s.entries||[]).map((e,i)=>`<div class="ezpz-history-entry"><span class="ezpz-index">${i+1}</span><div><b>${esc(e.name)}</b><div class="muted tiny">${esc(e.weight||'—')} ${esc(e.unit||'lb')} · ${esc(e.reps||'—')} reps ${e.done?'· ✓ Complete':''}</div></div></div>`).join('')}</div></details></section>`).join('')||'<div class="ezpz-empty"><h3>No saved sessions</h3><p>Complete a workout to see it here.</p></div>'}</div><p id="ezpz-history-empty" class="muted" hidden>No sessions match those filters.</p>`}

function ezpzRecords(){const map=new Map();for(const session of db.sessions||[]){for(const e of session.entries||[]){if(!e.done)continue;const weight=Number(String(e.weight||'').trim());if(!Number.isFinite(weight)||weight<=0||!e.name)continue;const key=String(session.clientId)+'|'+String(e.name).toLowerCase()+'|'+String(e.unit||'lb');const prev=map.get(key);if(!prev||weight>prev.weight)map.set(key,{client:session.code,name:e.name,weight,unit:e.unit||'lb',date:session.date})}}return [...map.values()].sort((a,b)=>b.weight-a.weight)}

function ezpzRecordsMarkup(){const records=ezpzRecords().slice(0,6);return `<section class="ezpz-records"><div class="ezpz-section-kicker">BEST LOGGED WEIGHTS</div><h3>Personal records</h3>${records.map((r,i)=>`<div class="ezpz-record-row"><span class="ezpz-record-rank">${i+1}</span><div><b>${esc(r.name)}</b><small>${esc(r.client)} · ${new Date(r.date).toLocaleDateString()}</small></div><strong>${r.weight} <small>${esc(r.unit)}</small></strong></div>`).join('')||'<p class="muted">Complete exercises with a numeric weight to see records here.</p>'}<p class="dashboardhint">Highest completed weight logged per client and exercise. Not a calculated 1-rep max.</p></section>`}
function renderHome(){const sessions=db.sessions||[],clients=db.clients||[];const completed=sessions.reduce((n,s)=>n+(s.entries||[]).filter(e=>e.done).length,0);const entries=sessions.reduce((n,s)=>n+(s.entries||[]).length,0);const dates=new Set(sessions.map(s=>String(s.date||'').slice(0,10)));const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-6+i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return {label:d.toLocaleDateString(undefined,{weekday:'short'}),count:sessions.filter(s=>String(s.date||'').slice(0,10)===key).length}});const max=Math.max(1,...days.map(d=>d.count));el.innerHTML=`<div class="dashboardhero"><div class="pill">✦ YOUR COACHING SPACE</div><h2>Make today<br>count<span class="ezpz-hero-dot">.</span></h2><p>Coaching overview based on your existing saved workouts.</p><button class="primary" data-action="home-train">Start a workout →</button></div><div class="dashboardgrid"><div class="dashboardmetric"><b>${clients.length}</b><small>Clients</small></div><div class="dashboardmetric"><b>${sessions.length}</b><small>Sessions logged</small></div><div class="dashboardmetric"><b>${entries?Math.round(completed/entries*100)+'%':'—'}</b><small>Exercises completed</small></div><div class="dashboardmetric"><b>${dates.size}</b><small>Training days recorded</small></div></div><section><h3><span class="ezpz-heading-icon">▥</span> Last 7 days</h3><div class="activitygrid">${days.map(d=>`<div class="activityday"><div class="activitybar" style="height:${Math.max(3,Math.round(d.count/max*90))}px" title="${d.count} sessions"></div>${d.label}</div>`).join('')}</div><p class="dashboardhint">Sessions per day, from existing history.</p></section><section><h3><span class="ezpz-heading-icon">♧</span> Your clients</h3>${clients.map(c=>`<div class="homeclient"><div><b>${esc(c.code)}</b><small>${esc(c.level)} · Week ${c.week}/12</small></div><button data-action="open" data-id="${esc(c.id)}">Open →</button></div>`).join('')||'<p class="muted">No clients yet.</p>'}</section>${ezpzChartMarkup()}${ezpzRecordsMarkup()}<div class="quicklinks"><button data-action="home-builder">Builder</button><button data-action="home-history">History</button><button data-action="home-backup">Backup</button></div><section><h3>4.0 design studio</h3><p class="muted">Explore experimental features separately. Studio data is not merged with your real clients.</p><a href="./preview/index.html" style="color:#b4f5d8">Open the 4.0 feature preview →</a></section>`}
function render(){if(tab==='home')renderHome();else if(tab==='clients')renderClients();else if(tab==='train')renderTrain();else if(tab==='builder')renderBuilder();else if(tab==='editor')renderEditor();else if(tab==='history')renderHistory();else renderBackup()}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ezpz-v2-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(file){if(!file)return;try{if(file.size>5e6)throw Error('Backup is too large');const next=normalize(JSON.parse(await file.text()));if(!confirm('Replace all current clients, workouts and sessions?'))return;db=next;if(!save())return;active=db.clients[0]?.id||null;setTab('clients')}catch(e){alert('Could not restore: '+e.message)}}
document.querySelector('.ezpz-bottom-nav').addEventListener('click',e=>{const b=e.target.closest('[data-bottom]');if(b)setTab(b.dataset.bottom)});document.getElementById('ezpz-fab').addEventListener('click',()=>setTab('train'));document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)setTab(b.dataset.nav)});el.addEventListener('input',e=>{if(e.target.dataset.clientNote){const c=db.clients.find(x=>x.id===e.target.dataset.clientNote);if(c){c.notes=e.target.value.slice(0,1000);const status=el.querySelector('[data-note-status="'+c.id+'"]');if(status)status.textContent=save()?'Saved on this device ✓':'Could not save notes'}return}if(e.target.id==='ezpz-exercise-search'){const q=e.target.value.trim().toLowerCase();el.querySelectorAll('[data-library-search]').forEach(card=>card.hidden=!card.dataset.librarySearch.includes(q));return}if(e.target.id==='ezpz-template-search'){const q=e.target.value.trim().toLowerCase();el.querySelectorAll('[data-template-search]').forEach(card=>card.hidden=!card.dataset.templateSearch.includes(q));return}if(e.target.id==='ezpz-client-search'){const q=e.target.value.trim().toLowerCase();el.querySelectorAll('.ezpz-client-card').forEach(card=>card.hidden=!card.dataset.search.includes(q));return}const f=e.target.dataset.field;if(f&&f!=='done')field(e.target.dataset.ex,f,e.target.value)});el.addEventListener('change',e=>{const f=e.target.dataset.field;if(f==='done'){field(e.target.dataset.ex,f,e.target.checked);ezpzUpdateWorkoutProgress()}if(e.target.dataset.change==='week')changeWeek(e.target.value);if(e.target.dataset.change==='mode')changeMode(e.target.value);if(e.target.id==='restore-file')restore(e.target.files[0]);if(e.target.id==='ezpz-history-client'||e.target.id==='ezpz-history-mode')ezpzFilterHistory()});el.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='home-clients')setTab('clients');else if(a==='ezpz-rest-start')ezpzRestStart(60);else if(a==='ezpz-rest-30')ezpzRestStart(30);else if(a==='ezpz-rest-60')ezpzRestStart(60);else if(a==='ezpz-rest-90')ezpzRestStart(90);else if(a==='ezpz-rest-stop'){ezpzRestStop();const w=document.getElementById('ezpz-rest-widget');if(w)w.hidden=true}else if(a==='home-train')setTab('train');else if(a==='home-builder')setTab('builder');else if(a==='home-history')setTab('history');else if(a==='home-backup')setTab('backup');else if(a==='add-client')addClient();else if(a==='open')selectClient(id);else if(a==='finish')finish();else if(a==='edit-client')startEditor('client');else if(a==='copy-exercise'){const name=b.dataset.name;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(name).then(()=>{b.querySelector('b').textContent='Copied ✓';setTimeout(()=>{if(b.isConnected)b.querySelector('b').textContent=name},1100)}).catch(()=>prompt('Copy exercise name:',name))}else prompt('Copy exercise name:',name)}else if(a==='duplicate-template'){const original=template(id);if(!original)return;const copy=clone(original);copy.id=uid();copy.name=(original.name+' Copy').slice(0,70);copy.exercises=(copy.exercises||[]).map(e=>({...e,id:uid()}));db.templates.push(copy);if(save())renderBuilder()}else if(a==='new-template'){const name=$('new-template').value.trim();if(!name)return alert('Name the workout');const t={id:uid(),name:name.slice(0,70),exercises:[]};db.templates.push(t);save();startEditor('template',t.id)}else if(a==='edit-template')startEditor('template',id);else if(a==='backup')backup();else editorAction(a,id)});
const ezpzPaletteKey='ezpz4-palette';
function ezpzApplyPalette(theme){const allowed=['mint','ocean','sunset','violet'];if(!allowed.includes(theme))theme='mint';document.body.dataset.theme=theme;document.querySelectorAll('[data-palette]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.palette===theme)));try{localStorage.setItem(ezpzPaletteKey,theme)}catch(e){}}
function ezpzTogglePalette(open){const picker=document.getElementById('ezpz-theme-picker');picker.hidden=!open;document.getElementById('ezpz-theme-button').setAttribute('aria-expanded',String(open))}
document.getElementById('ezpz-theme-button').addEventListener('click',()=>ezpzTogglePalette(document.getElementById('ezpz-theme-picker').hidden));
document.getElementById('ezpz-palette-close').addEventListener('click',()=>ezpzTogglePalette(false));
document.querySelectorAll('[data-palette]').forEach(b=>b.addEventListener('click',()=>ezpzApplyPalette(b.dataset.palette)));
document.addEventListener('keydown',e=>{if(e.key==='Escape')ezpzTogglePalette(false)});
try{ezpzApplyPalette(localStorage.getItem(ezpzPaletteKey)||'mint')}catch(e){ezpzApplyPalette('mint')}
setTab(tab);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
