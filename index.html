<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14252a"><link rel="manifest" href="manifest.webmanifest"><title>EZPZ Trainer</title><style>:root{font-family:system-ui,Arial;background:#10191c;color:#f3f7f6}*{box-sizing:border-box}body{margin:0;max-width:720px;margin:auto}header{background:#14252a;padding:20px 16px;position:sticky;top:0;z-index:2;border-bottom:1px solid #355057}h1{font-size:20px;margin:0}small,.muted{color:#a6bbb8}nav{display:flex;gap:8px;margin-top:16px}button,select,input,textarea{font:inherit;border-radius:10px;border:1px solid #45605f;padding:12px;background:#1e3033;color:white;min-width:0}button{cursor:pointer}button.primary{background:#7fe0c0;color:#09251e;border:0;font-weight:700}nav button{flex:1;padding:10px}main{padding:16px}section{border:1px solid #355057;border-radius:14px;padding:14px;margin:12px 0;background:#172529}.row{display:flex;align-items:center;gap:10px}.row>*{flex:1}.stack{display:grid;gap:10px}label{display:grid;gap:5px;font-size:13px;color:#c4d6d2}input,select,textarea{width:100%}.hidden{display:none}.ex{border-top:1px solid #345054;padding:15px 0}.ex:first-child{border:0}.pill{font-size:12px;color:#8de0c2}.tiny{font-size:12px}.danger{color:#ffaaaa}footer{padding:15px;text-align:center;font-size:12px;color:#8da5a0}</style></head><body><header><h1>🏋️ EZPZ Trainer</h1><small>Private 12-week training tracker · offline-first</small><nav><button onclick="view('clients')">Clients</button><button onclick="view('train')">Train</button><button onclick="view('history')">History</button><button onclick="view('backup')">Backup</button></nav></header><main id="app"></main><footer>Keep identifying and sensitive client information out of this local prototype.</footer><script>
const P={Beginner:{A:[['Box Squat','2 × 10'],['Seated Cable Row','2 × 12'],['Machine Chest Press','2 × 10'],['Step-up','2 × 8/side'],['Farmer Carry','2 × 30 sec']],B:[['Leg Press','2 × 12'],['Lat Pulldown','2 × 10'],['DB Romanian Deadlift','2 × 10'],['Pallof Press','2 × 10/side'],['Tandem Balance','2 × 30 sec']]},Intermediate:{A:[['Goblet Squat','3 × 10'],['Cable Row','3 × 10'],['DB Chest Press','3 × 10'],['Reverse Lunge','3 × 8/side'],['Farmer Carry','3 × 40 sec']],B:[['DB Romanian Deadlift','3 × 10'],['Lat Pulldown','3 × 10'],['Incline DB Press','3 × 10'],['Step-up','3 × 10/side'],['Pallof Press','3 × 12/side']]},Advanced:{A:[['Trap Bar Deadlift','4 × 6'],['Weighted Pull-up','4 × 6'],['DB Bench Press','4 × 8'],['Bulgarian Split Squat','3 × 8/side'],['Heavy Carry','3 × 40 sec']],B:[['Front Squat','4 × 6'],['Chest Supported Row','4 × 8'],['DB Shoulder Press','3 × 8'],['Hip Thrust','3 × 10'],['Hanging Knee Raise','3 × 12']]}};
const key='ezpz-v1';let db;try{db=JSON.parse(localStorage.getItem(key))||{clients:[],sessions:[]}}catch{db={clients:[],sessions:[]}};let active=db.clients[0]?.id||null,tab='clients',mode='A',draft={};const el=document.getElementById('app');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){localStorage.setItem(key,JSON.stringify(db))}function view(t){tab=t;render()}function client(){return db.clients.find(x=>x.id===active)}function selectClient(id){active=id;draft={};tab='train';render()}function addClient(){const code=document.getElementById('code').value.trim();if(!code)return alert('Enter a client code');const c={id:Date.now(),code,level:document.getElementById('level').value,week:1};db.clients.push(c);save();selectClient(c.id)}function changeWeek(n){client().week=Number(n);save();draft={};render()}function changeMode(m){mode=m;draft={};render()}function field(i,k,v){draft[i]??={};draft[i][k]=v}function previous(c,exercise){return db.sessions.filter(s=>s.clientId===c.id).reverse().flatMap(s=>s.entries).find(e=>e.name===exercise&&e.weight)}function finish(){const c=client();if(!c)return;const entries=P[c.level][mode].map(([name,target],i)=>({name,target,weight:draft[i]?.weight||'',reps:draft[i]?.reps||'',done:!!draft[i]?.done}));db.sessions.push({id:Date.now(),clientId:c.id,code:c.code,week:c.week,mode,date:new Date().toISOString(),entries});save();draft={};tab='history';render()}
function render(){if(tab==='clients'){el.innerHTML=`<h2>Clients</h2>${db.clients.map(c=>`<section><div class="row"><div><b>${esc(c.code)}</b><div class="muted tiny">${c.level} · Week ${c.week}/12</div></div><button onclick="selectClient(${c.id})">Open →</button></div></section>`).join('')||'<p class="muted">Add your first client code.</p>'}<section class="stack"><h3>Add client</h3><label>Client code (not full name)<input id="code" placeholder="e.g. C001" maxlength="30"></label><label>Level<select id="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><button class="primary" onclick="addClient()">Add client</button></section>`}else if(tab==='train'){const c=client();if(!c){el.innerHTML='<p>Add a client first.</p>';return}el.innerHTML=`<h2>${esc(c.code)} <span class="pill">${c.level}</span></h2><div class="row"><label>Week<select onchange="changeWeek(this.value)">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${c.week===i+1?'selected':''}>Week ${i+1}</option>`).join('')}</select></label><label>Workout<select onchange="changeMode(this.value)"><option ${mode==='A'?'selected':''}>A</option><option ${mode==='B'?'selected':''}>B</option></select></label></div><section><div class="muted tiny">Warm up 5–10 minutes. Modify movements to match ability, symptoms and goals.</div>${P[c.level][mode].map(([name,target],i)=>{const p=previous(c,name);return `<div class="ex"><b>${i+1}. ${esc(name)}</b><div class="pill">${esc(target)}</div><div class="muted tiny">Last: ${p?esc(p.weight)+' lb · '+esc(p.reps)+' reps':'No previous entry'}</div><div class="row" style="margin-top:10px"><label>Weight (lb)<input type="number" min="0" step="0.5" placeholder="0" oninput="field(${i},'weight',this.value)"></label><label>Completed reps<input placeholder="10,10,9" oninput="field(${i},'reps',this.value)"></label></div><label style="display:block;margin-top:8px"><input type="checkbox" style="width:auto" onchange="field(${i},'done',this.checked)"> Completed</label></div>`}).join('')}<button class="primary" style="width:100%" onclick="finish()">Finish & save session</button></section>`}else if(tab==='history'){el.innerHTML=`<h2>Training history</h2>${db.sessions.slice().reverse().map(s=>`<section><b>${esc(s.code)} · Week ${s.week} · ${s.mode}</b><div class="muted tiny">${new Date(s.date).toLocaleString()}</div>${s.entries.map(e=>`<div class="tiny" style="padding-top:7px">${esc(e.name)}: ${esc(e.weight||'—')} lb · ${esc(e.reps||'—')} reps</div>`).join('')}</section>`).join('')||'<p class="muted">No sessions saved yet.</p>'}`}else{el.innerHTML=`<h2>Backup & restore</h2><section class="stack"><p class="muted">Data is stored in this browser on this device. Export a backup regularly. Browser data can be erased and this is not encrypted storage.</p><button class="primary" onclick="backup()">Download JSON backup</button><label>Restore a backup<input type="file" accept="application/json,.json" onchange="restore(this.files[0])"></label><p class="danger tiny">Restoring replaces all current data. Use only your own trusted backup files.</p></section>`}}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ezpz-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.clients)||!Array.isArray(d.sessions))throw Error('Invalid file');if(!confirm('Replace all current records with this backup?'))return;db=d;save();active=db.clients[0]?.id||null;view('clients')}catch(e){alert('Could not restore: '+e.message)}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
