function renderBuilder(){el.innerHTML=`<h2>Workout Builder</h2><p class="muted">Edit a reusable template or create your own. Editing a template updates clients who still use it; individually customized clients stay unchanged.</p><section class="stack"><h3>Create workout template</h3><label>Workout name<input id="new-template" placeholder="e.g. Mobility Day"></label><button class="primary" data-action="new-template">+ Create template</button></section>${db.templates.map(t=>`<section><div class="row"><div><b>${esc(t.name)}</b><div class="muted tiny">${t.exercises.length} exercises</div></div><button data-action="edit-template" data-id="${esc(t.id)}">Edit →</button></div></section>`).join('')}`}
function startEditor(scope,id){editing={scope,id};editClient=scope==='client';setTab('editor')}
function editTarget(){if(!editing)return null;if(editing.scope==='template')return template(editing.id);const c=client();if(!c)return null;if(!c.customWorkouts)c.customWorkouts={};if(!c.customWorkouts[mode])c.customWorkouts[mode]=clone(getWorkouts(c)[mode]);return c.customWorkouts[mode]}
function renderEditor(){const w=editTarget();if(!w){setTab('builder');return}el.innerHTML=`<div class="toolbar"><button data-action="back-editor">← Back</button><button class="primary" data-action="save-editor">Save changes</button></div><h2>${editing.scope==='client'?'Client '+esc(client().code)+' · '+mode:'Template editor'}</h2><section class="stack"><label>Workout name<input id="workout-name" value="${esc(w.name)}" maxlength="70"></label><p class="muted tiny">Change any exercise below. Changes save when you tap Save changes.</p>${w.exercises.map((e,i)=>`<div class="ex" data-ex-row="${esc(e.id)}"><label>Exercise ${i+1}<input data-edit="name" data-id="${esc(e.id)}" value="${esc(e.name)}" maxlength="90"></label><div class="grid2"><label>Sets<input type="number" min="1" max="20" data-edit="sets" data-id="${esc(e.id)}" value="${e.sets}"></label><label>Reps / duration<input data-edit="reps" data-id="${esc(e.id)}" value="${esc(e.reps)}" maxlength="35"></label><label>Rest (seconds)<input type="number" min="0" max="900" data-edit="rest" data-id="${esc(e.id)}" value="${e.rest||0}"></label><label>Unit<select data-edit="unit" data-id="${esc(e.id)}">${['lb','kg','BW','sec','yd','m'].map(u=>`<option ${e.unit===u?'selected':''}>${u}</option>`).join('')}</select></label></div><div class="toolbar" style="margin-top:8px"><button data-action="move-up" data-id="${esc(e.id)}" ${i===0?'disabled':''}>↑</button><button data-action="move-down" data-id="${esc(e.id)}" ${i===w.exercises.length-1?'disabled':''}>↓</button><button class="danger" data-action="remove-ex" data-id="${esc(e.id)}">Remove</button></div></div>`).join('')}<button class="primary" data-action="add-ex">+ Add exercise</button>${editing.scope==='client'?`<button data-action="reset-client">Reset to current ${esc(client().level)} ${mode} template</button>`:''}</section>`}
function syncEditor(){const w=editTarget();if(!w)return;w.name=$('workout-name').value.trim().slice(0,70)||'Untitled workout';el.querySelectorAll('[data-edit]').forEach(inp=>{const e=w.exercises.find(x=>x.id===inp.dataset.id);if(!e)return;const k=inp.dataset.edit;e[k]=k==='sets'?Math.max(1,Math.min(20,Number(inp.value)||1)):k==='rest'?Math.max(0,Math.min(900,Number(inp.value)||0)):inp.value.slice(0,k==='name'?90:35)})}
function editorAction(a,id){const w=editTarget();if(!w)return;syncEditor();if(a==='add-ex')w.exercises.push({id:uid(),name:'New exercise',sets:3,reps:'10',rest:60,unit:'lb'});if(a==='remove-ex'){if(!confirm('Remove this exercise?'))return;w.exercises=w.exercises.filter(e=>e.id!==id)}if(a==='move-up'||a==='move-down'){const i=w.exercises.findIndex(e=>e.id===id),j=i+(a==='move-up'?-1:1);if(j>=0&&j<w.exercises.length)[w.exercises[i],w.exercises[j]]=[w.exercises[j],w.exercises[i]]}if(a==='reset-client'){if(!confirm('Replace this client workout with the current standard template?'))return;delete client().customWorkouts[mode];editing=null;save();setTab('train');return}if(a==='save-editor'){if(w.exercises.some(e=>!e.name.trim()))return alert('Give every exercise a name');save();editing=null;setTab(editClient?'train':'builder');return}if(a==='back-editor'){save();editing=null;setTab(editClient?'train':'builder');return}renderEditor()}
function renderHistory(){el.innerHTML=`<h2>Session history</h2>${db.sessions.slice().reverse().map(s=>`<section><b>${esc(s.code)} · Week ${esc(s.week)} · ${esc(s.workoutName||s.mode)}</b><div class="muted tiny">${new Date(s.date).toLocaleString()}</div>${s.entries.map(e=>`<div class="tiny" style="padding-top:7px">${esc(e.name)}: ${esc(e.weight||'—')} ${esc(e.unit||'lb')} · ${esc(e.reps||'—')} reps</div>`).join('')}</section>`).join('')||'<p class="muted">No saved sessions.</p>'}`}
function renderBackup(){el.innerHTML=`<h2>Backup & restore</h2><section class="stack"><p class="notice">Your workouts and records are saved only in this browser. Export backups regularly, especially before updating. This is not encrypted client-data storage.</p><button class="primary" data-action="backup">Download JSON backup</button><label>Restore backup<input id="restore-file" type="file" accept="application/json,.json"></label><p class="danger tiny">Restoring replaces all current data. Only use a trusted EZPZ backup.</p></section><section><h3>App update</h3><p class="muted tiny">Replace your GitHub repository files to update the app. Existing records should remain on the same browser origin, but always download a backup first.</p></section>`}

function renderHome(){const sessions=db.sessions||[],clients=db.clients||[];const completed=sessions.reduce((n,s)=>n+(s.entries||[]).filter(e=>e.done).length,0);const entries=sessions.reduce((n,s)=>n+(s.entries||[]).length,0);const dates=new Set(sessions.map(s=>String(s.date||'').slice(0,10)));const days=Array.from({length:7},(_,i)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-6+i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return {label:d.toLocaleDateString(undefined,{weekday:'short'}),count:sessions.filter(s=>String(s.date||'').slice(0,10)===key).length}});const max=Math.max(1,...days.map(d=>d.count));el.innerHTML=`<div class="dashboardhero"><div class="pill">EZPZ Trainer 4.0</div><h2>Ready for today?</h2><p>Coaching overview based on your existing saved workouts.</p><button class="primary" data-action="home-train">Start a workout →</button></div><div class="dashboardgrid"><div class="dashboardmetric"><b>${clients.length}</b><small>Clients</small></div><div class="dashboardmetric"><b>${sessions.length}</b><small>Sessions logged</small></div><div class="dashboardmetric"><b>${entries?Math.round(completed/entries*100)+'%':'—'}</b><small>Exercises completed</small></div><div class="dashboardmetric"><b>${dates.size}</b><small>Training days recorded</small></div></div><section><h3>Last 7 days</h3><div class="activitygrid">${days.map(d=>`<div class="activityday"><div class="activitybar" style="height:${Math.max(3,Math.round(d.count/max*90))}px" title="${d.count} sessions"></div>${d.label}</div>`).join('')}</div><p class="dashboardhint">Sessions per day, from existing history.</p></section><section><h3>Clients</h3>${clients.map(c=>`<div class="homeclient"><div><b>${esc(c.code)}</b><small>${esc(c.level)} · Week ${c.week}/12</small></div><button data-action="open" data-id="${esc(c.id)}">Open →</button></div>`).join('')||'<p class="muted">No clients yet.</p>'}</section><div class="quicklinks"><button data-action="home-builder">Builder</button><button data-action="home-history">History</button><button data-action="home-backup">Backup</button></div><section><h3>4.0 design studio</h3><p class="muted">Explore experimental features separately. Studio data is not merged with your real clients.</p><a href="./preview/index.html" style="color:#b4f5d8">Open the 4.0 feature preview →</a></section>`}
function render(){if(tab==='home')renderHome();else if(tab==='clients')renderClients();else if(tab==='train')renderTrain();else if(tab==='builder')renderBuilder();else if(tab==='editor')renderEditor();else if(tab==='history')renderHistory();else renderBackup()}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ezpz-v2-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(file){if(!file)return;try{if(file.size>5e6)throw Error('Backup is too large');const next=normalize(JSON.parse(await file.text()));if(!confirm('Replace all current clients, workouts and sessions?'))return;db=next;if(!save())return;active=db.clients[0]?.id||null;setTab('clients')}catch(e){alert('Could not restore: '+e.message)}}
document.querySelector('.ezpz-bottom-nav').addEventListener('click',e=>{const b=e.target.closest('[data-bottom]');if(b)setTab(b.dataset.bottom)});document.getElementById('ezpz-fab').addEventListener('click',()=>setTab('train'));document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)setTab(b.dataset.nav)});el.addEventListener('input',e=>{const f=e.target.dataset.field;if(f&&f!=='done')field(e.target.dataset.ex,f,e.target.value)});el.addEventListener('change',e=>{const f=e.target.dataset.field;if(f==='done')field(e.target.dataset.ex,f,e.target.checked);if(e.target.dataset.change==='week')changeWeek(e.target.value);if(e.target.dataset.change==='mode')changeMode(e.target.value);if(e.target.id==='restore-file')restore(e.target.files[0])});el.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='home-train')setTab('train');else if(a==='home-builder')setTab('builder');else if(a==='home-history')setTab('history');else if(a==='home-backup')setTab('backup');else if(a==='add-client')addClient();else if(a==='open')selectClient(id);else if(a==='finish')finish();else if(a==='edit-client')startEditor('client');else if(a==='new-template'){const name=$('new-template').value.trim();if(!name)return alert('Name the workout');const t={id:uid(),name:name.slice(0,70),exercises:[]};db.templates.push(t);save();startEditor('template',t.id)}else if(a==='edit-template')startEditor('template',id);else if(a==='backup')backup();else editorAction(a,id)});setTab(tab);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
