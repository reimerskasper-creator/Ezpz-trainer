function migrateWorkoutDrafts(){if(Number(state.workoutLayoutVersion)>=2)return false;for(const id of ['cardio-a','cardio-b','hiit-a','hiit-b']){const draft=state.workoutDrafts?.[id];if(!draft||typeof draft!=='object')continue;const mapped={};for(const [key,value] of Object.entries(draft)){const m=key.match(/^(sr|sw|sd)2-(\d+)$/);mapped[m?m[1]+'7-'+m[2]:key]=value}state.workoutDrafts[id]=mapped}state.workoutLayoutVersion=2;return true}

function homeOverview(){const now=new Date(),monday=new Date(now);monday.setDate(now.getDate()-(now.getDay()+6)%7);monday.setHours(0,0,0,0);const nextMonday=new Date(monday);nextMonday.setDate(monday.getDate()+7);const logs=state.logs.filter(x=>x&&Number.isFinite(new Date(x.date).getTime())&&new Date(x.date)<=now),weekly=logs.filter(x=>new Date(x.date)>=monday&&new Date(x.date)<nextMonday),trainingDays=new Set(weekly.map(x=>new Date(x.date).toDateString()));const plan=workoutPlan(),draft=workoutDraft(plan),totalSets=plan.exercises.reduce((sum,x)=>sum+x.sets,0),doneSets=plan.exercises.reduce((sum,x,i)=>sum+Array.from({length:x.sets},(_,j)=>draft['sd'+i+'-'+j]===true?1:0).reduce((a,b)=>a+b,0),0),hasDraft=Object.entries(draft).some(([k,v])=>/^(sr|sw|sd)\d+-\d+$/.test(k)&&(v===true||typeof v==='number'&&Number.isFinite(v)||typeof v==='string'&&v.trim()!=='')),completedToday=logs.some(x=>new Date(x.date).toDateString()===now.toDateString()&&(plan.id==='full-body'?(!x.workoutId||x.workoutId==='full-body')&&x.type===state.profile.equipment:x.workoutId===plan.id));const weights=state.weights.filter(x=>x&&Number.isFinite(Number(x.kg))&&Number(x.kg)>0),weight=weights.at(-1),previous=weights.at(-2),delta=weight&&previous?Math.round((Number(weight.kg)-Number(previous.kg))*10)/10:null;const shoppingNames=new Set((Array.isArray(state.shopping)?state.shopping:[]).flatMap(x=>{const m=typeof x==='string'&&x.match(/^(.*) — ([0-9.]+) g$/);return m?[m[1]]:[]})),shoppingLeft=[...shoppingNames].filter(x=>!state.checkedShopping?.[x]).length;return {now,monday,weekly,trainingDays,plan,draft,totalSets,doneSets,hasDraft,completedToday,weight,delta,shoppingLeft,shoppingTotal:shoppingNames.size,food:foodSummary(),goals:target()}}
