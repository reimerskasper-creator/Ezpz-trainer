function foodSummary(){const entries=foodEntries().filter(x=>x.date===foodDate());const totals=[0,0,0,0];for(const e of entries){if(!Array.isArray(e.macros))continue;e.macros.forEach((n,i)=>{if(i<4&&Number.isFinite(n))totals[i]+=n})}return {entries,totals:totals.map(Math.round)}}

function updateRecipe(i){const r=recipes[i],scale=Number(document.querySelector('[data-serving="'+i+'"]')?.value||1),n=nutrition(r.ingredients,scale),grams=Math.round(r.ingredients.reduce((sum,x)=>sum+x[1]*scale,0)),out=document.querySelector('[data-nutrition="'+i+'"]'),list=document.querySelector('[data-ingredients="'+i+'"]');if(out)out.textContent=grams+' g total ingredient weight';const kcal=document.querySelector('[data-kcal="'+i+'"]'),macros=document.querySelector('[data-macros="'+i+'"]');if(kcal)kcal.textContent=n[0]+' kcal';if(macros)macros.textContent='P '+n[1]+' g  ·  C '+n[2]+' g  ·  F '+n[3]+' g';for(const [key,v] of [['protein',n[1]],['carbs',n[2]],['fat',n[3]]]){const el=document.querySelector('[data-'+key+'="'+i+'"]');if(el)el.textContent=v+'g'}if(list)list.innerHTML=r.ingredients.map(([food,g])=>'<li>'+safe(food)+' — '+Math.round(g*scale*10)/10+' g</li>').join('')}
function shopping(){const list=Array.isArray(state.shopping)?state.shopping:[],merged=new Map();for(const entry of list){if(typeof entry!=='string')continue;const m=entry.match(/^(.*) — ([0-9.]+) g$/);if(!m)continue;merged.set(m[1],(merged.get(m[1])||0)+Number(m[2]))}const entries=[...merged.entries()];const checked=state.checkedShopping||{};screen.innerHTML='<div class="shopping-head"><span class="shopping-eyebrow">EZPZ NUTRITION</span><h2>Shopping list</h2><p>Everything you need, in one place.</p></div><div class="shopping-group-label"><strong>Ingredients</strong><small>Tap to check off</small></div><section class="card shopping-panel">'+(entries.length?entries.map(([food,g],i)=>'<label class="shopping-item"><input type="checkbox" data-shop-check="'+i+'" data-shop-name="'+safe(food)+'" '+(checked[food]?'checked':'')+'><span>'+safe(food)+'</span><strong>'+Math.round(g*10)/10+' g</strong></label>').join(''):'<div class="shopping-empty"><span aria-hidden="true">☷</span><strong>Your list is empty</strong><p>Choose a recipe to add ingredients.</p></div>')+'</section><button class="primary" data-go="eat">Browse recipes</button>'+(entries.length?'<button data-action="clear-completed" style="margin-top:10px">Remove checked ingredients</button><button data-action="clear-shopping" style="margin-top:10px">Clear entire list</button>':'')+'<p class="note">Checkmarks stay saved on this device.</p>'}
function progress(){const logs=state.logs.slice().reverse(),weights=state.weights.slice().reverse(),recent=logs.slice(0,10),latest=weights[0]?.kg,first=weights[weights.length-1]?.kg,delta=weights.length>1?Math.round((latest-first)*10)/10:null;screen.innerHTML='<div class="ez-section-heading"><span class="ez-eyebrow">EZPZ FITNESS</span><h2>Your progress</h2><p>Every session counts.</p></div><div class="grid progress-stats"><section class="card"><small>Workouts completed</small><div class="metric">'+logs.length+'</div></section><section class="card"><small>Latest weight</small><div class="metric">'+(latest??'—')+'</div><small>kg</small></section></div><section class="card"><h3>Weight trend</h3>'+(weights.length>1?'<div class="trend-chart" role="img" aria-label="Body weight history chart"><svg viewBox="0 0 320 120" preserveAspectRatio="none"><polyline fill="none" stroke="#0aaf60" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="'+weights.slice().reverse().slice(-24).map((w,i,arr)=>{const vals=arr.map(x=>Number(x.kg)),min=Math.min(...vals)-.5,max=Math.max(...vals)+.5;return (12+i*296/Math.max(1,arr.length-1))+','+(105-(Number(w.kg)-min)/(max-min)*90)}).join(' ')+'"/></svg></div><p class="note">Change since first entry: '+(delta>0?'+':'')+delta+' kg</p>':'<p>Log two weigh-ins to see a trend.</p>')+'</section><section class="card"><h3>Log body weight</h3><form id="weightform"><label>Weight (kg)</label><input name="kg" type="number" step=".1" min="30" max="350" required><button class="primary" style="margin-top:12px">Save weight</button></form></section><section class="card"><h3>Workout history</h3>'+(recent.length?recent.map(x=>'<details class="exercise"><summary>'+new Date(x.date).toLocaleDateString()+' · Workout '+safe(x.variant||'')+' · '+safe(x.type)+'</summary>'+(x.exercises||[]).map(e=>'<p>'+safe(e.name)+' · '+safe(e.sets?.length?e.sets.filter(z=>z.reps).map(z=>z.reps+' × '+(z.kg||'BW')+' kg').join(' / '):e.reps||e.prescription||'—')+'</p>').join('')+'</details>').join(''):'<p>No sessions logged yet.</p>')+'</section><section class="card"><h3>Your data</h3><p class="note">Data is saved in this browser. Download a backup before switching devices.</p><button data-action="export">Download backup</button><label for="restore-file">Restore a backup</label><input id="restore-file" type="file" accept="application/json,.json"><button data-action="restore" style="margin-top:10px">Restore backup</button></section>'}

setDone;value=e.target.checked}else if(d.reps!==undefined)k='r'+d.reps;else if(d.load!==undefined)k='w'+d.load;if(k&&state.profile){state.draft=state.draft?.variant===workoutPlan().variant&&state.draft?.equipment===state.profile.equipment?state.draft:{variant:workoutPlan().variant,equipment:state.profile.equipment};state.draft[k]=value;save();if(d.setDone!==undefined)updateWorkoutProgress()}});
document.addEventListener('click',e=>{const addPlan=e.target.closest('[data-action="plan-to-shopping"],[data-action="week-to-shopping"]');if(addPlan){const all=addPlan.dataset.action==='week-to-shopping',dates=all?Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d.toLocaleDateString('en-CA')}):[mealPlanDay()];const selected=dates.flatMap(date=>{const day=plannedMeals()[date]||{};return ['breakfast','lunch','dinner'].map(slot=>({i:day[slot],scale:planPortion(day,slot)})).filter(x=>Number.isInteger(x.i)&&recipes[x.i])});if(!selected.length){alert('Choose at least one meal first.');return}state.shopping=Array.isArray(state.shopping)?state.shopping:[];for(const {i,scale} of selected)for(const [name,g] of recipes[i].ingredients)state.shopping.push(name+' — '+Math.round(g*scale*10)/10+' g');save();tab='shopping';render();return}const remove=e.target.closest('[data-remove-food]');if(remove){state.foodLog=foodEntries().filter(x=>x.id!==remove.dataset.removeFood);save();eat();return}const logFood=e.target.closest('[data-log-food]');if(logFood){const i=Number(logFood.dataset.logFood),r=recipes[i],scale=Number(document.querySelector('[data-serving="'+i+'"]')?.value||1);if(r&&[.5,1,1.5,2].includes(scale)){state.foodLog=foodEntries();state.foodLog.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),date:foodDate(),name:r.name,servings:scale,macros:nutrition(r.ingredients,scale)});save();tab='eat';eat()}return}const lib=e.target.closest('[data-library-id]');if(lib){librarySelected=lib.dataset.libraryId;exerciseLibrary();window.scrollTo(0,0);return}const guide=e.target.closest('[data-open-exercise]');if(guide){const name=guide.dataset.openExercise;const aliases={'DB Romanian Deadlift':'Dumbbell Romanian Deadlift','Floor Press':'Dumbbell Floor Press','Hip Hinge':'Hip Hinge Drill','DB Shoulder Press':'Seated Dumbbell Shoulder Press'};librarySelected=(aliases[name]||name).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');tab='library';render();window.scrollTo(0,0);return}const nav=e.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;render();window.scrollTo(0,0);return}const go=e.target.closest('[data-go]');if(go){tab=go.dataset.go;render();window.scrollTo(0,0);return}const meal=e.target.closest('[data-open-meal]');if(meal){tab='meal';mealDetail(Number(meal.dataset.openMeal));window.scrollTo(0,0);return}const filter=e.target.closest('[data-meal-filter]');if(filter){mealFilter=filter.dataset.mealFilter;document.querySelectorAll('[data-meal-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===filter)));document.querySelectorAll('[data-meal-category]').forEach(el=>el.hidden=mealFilter!=='all'&&el.dataset.mealCategory!==mealFilter);return}const step=e.target.closest('[data-photo-step]');if(step){const frame=step.closest('.exercise-photo-frame'),img=frame?.querySelector('img');if(img){const next=step.dataset.photoStep==='1'?2:1;img.src=next===1?img.dataset.approvedStart:img.dataset.approvedFinish;img.alt=img.alt.replace(/starting position|next position/,next===1?'starting position':'next position');step.dataset.photoStep=String(next);step.textContent='Position '+next+' / 2 ↔';step.setAttribute('aria-label','Show '+(next===1?'next':'starting')+' position')}return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='library-back'){librarySelected=null;exerciseLibrary();return}if(action==='reload-library'){exerciseCatalog=null;libraryLoading=false;exerciseLibrary();return}if(action==='finish'){const exercises=workoutPlan().exercises.map((x,i)=>{const sets=Array.from({length:x.sets},(_,j)=>({reps:document.querySelector('[data-set-reps="'+i+'-'+j+'"]')?.value||'',kg:document.querySelector('[data-set-weight="'+i+'-'+j+'"]')?.value||'',done:!!document.querySelector('[data-set-done="'+i+'-'+j+'"]')?.checked}));return {name:x.name,prescription:x.sets+' × '+x.reps,sets:sets.map(z=>z.done?z:{reps:'',kg:'',done:false}),reps:sets.filter(z=>z.done&&z.reps).map(z=>z.reps).join(', '),kg:sets.find(z=>z.done&&z.kg)?.kg||''}});const completedSets=exercises.reduce((n,x)=>n+x.sets.filter(z=>z.done&&z.reps!==''&&Number(z.reps)>0).length,0);if(!completedSets){alert('Enter reps and check off at least one completed set before saving.');return}const incomplete=exercises.reduce((n,x)=>n+x.sets.filter(z=>z.done&&(z.reps===''||Number(z.reps)<=0)).length,0);if(incomplete){alert('Some checked sets have no valid rep count. Add reps or uncheck those sets.');return}const unchecked=exercises.reduce((n,x)=>n+x.sets.filter(z=>z.reps!==''&&!z.done).length,0);if(unchecked&&!confirm(unchecked+' entered set(s) are not checked complete. Save only the checked sets?'))return;state.logs.push({date:new Date().toISOString(),type:state.profile.equipment,variant:workoutPlan().variant,exercises});state.draft={};if(save()){tab='progress';render()}}if(action==='clear-draft'&&confirm('Clear your unfinished workout entries?')){state.draft={};save();render()}if(action==='reset'&&confirm('Change your plan? Your workout and weight history will be kept.')){state.profile=null;state.draft={};save();render()}if(action==='clear-completed'){const checked=state.checkedShopping||{};state.shopping=(state.shopping||[]).filter(x=>!checked[String(x).split(' — ')[0]]);state.checkedShopping={};save();render();return}if(action==='clear-shopping'&&confirm('Clear your entire shopping list?')){state.shopping=[];state.checkedShopping={};save();render()}const recipe=e.target.closest('[data-recipe]');if(recipe){const r=recipes[Number(recipe.dataset.recipe)];if(r){state.shopping=Array.isArray(state.shopping)?state.shopping:[];const scale=Number(document.querySelector('[data-serving="'+recipe.dataset.recipe+'"]')?.value||1);for(const [name,g] of r.ingredients)state.shopping.push(name+' — '+Math.round(g*scale*10)/10+' g');save();tab='shopping';render()}}if(action==='restore'){const file=document.getElementById('restore-file')?.files?.[0];if(!file){alert('Choose a backup JSON file first.');return}if(file.size>2000000){alert('Backup exceeds 2 MB.');return}file.text().then(raw=>{let data;try{data=JSON.parse(raw)}catch(e){throw Error('Invalid JSON backup')}if(!data||typeof data!=='object'||!Array.isArray(data.logs)||!Array.isArray(data.weights)||data.logs.length>10000||data.weights.length>10000||data.profile!==null&&typeof data.profile!=='object')throw Error('Not an EZPZ Fitness backup');if(data.profile){const p=data.profile;if(!['home','gym'].includes(p.equipment)||!['Beginner','Intermediate','Advanced'].includes(p.level)||!Number.isFinite(p.weight)||!Number.isFinite(p.height)||!Number.isFinite(p.age)||!Number.isFinite(p.days)||p.weight<30||p.weight>350||p.height<120||p.height>230||p.age<18||p.age>100||p.days<2||p.days>5)throw Error('Invalid profile in backup')}if(!confirm('Replace all fitness data on this device with this backup?'))return;const prior=state;state={profile:data.profile||null,logs:data.logs,weights:data.weights,shopping:Array.isArray(data.shopping)?data.shopping.slice(0,100):[],draft:{}};if(!save()){state=prior;return}tab='home';render()}).catch(err=>alert('Restore failed: '+err.message));return}if(action==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ezpz-fitness-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
