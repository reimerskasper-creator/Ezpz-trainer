// Generic food-composition estimates; branded products and cooking losses vary.
const foods={

{name:'Greek yogurt berry bowl',ingredients:[['Plain nonfat Greek yogurt',250],['Rolled oats (dry)',45],['Blueberries (raw)',100],['Peanut butter (plain)',15]],instructions:'Combine yogurt and dry oats. Add berries and peanut butter.'},
{name:'Chicken rice bowl',ingredients:[['Chicken breast (cooked, skinless)',150],['White rice (cooked)',180],['Broccoli (cooked)',150],['Olive oil',10]],instructions:'Weigh chicken, rice and broccoli after cooking. Combine and add olive oil.'},

function nutrition(ingredients,scale=1){const values=[0,0,0,0];for(const [name,grams] of ingredients){const row=foods[name];if(!row||!Number.isFinite(grams)||grams<0)throw Error('Missing nutrition reference: '+name);row.forEach((v,i)=>values[i]+=v*grams*scale/100)}return values.map(Math.round)}
const meals=recipes.map(r=>[r.name,...nutrition(r.ingredients)]);
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!state||typeof state!=='object')state={profile:null,logs:[],weights:[]};if(!Array.isArray(state.logs))state.logs=[];if(!Array.isArray(state.weights))state.weights=[];
let tab='home',mealFilter='all';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Unable to save on this device. Check storage settings.');return false}}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]))}
function target(){const p=state.profile;const activity=p.days>=4?1.5:1.35;const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161);const calories=Math.max(1400,Math.round((bmr*activity+(p.goal==='lose'?-350:p.goal==='gain'?200:0))/50)*50);const protein=Math.round(p.weight*1.6),fat=Math.round(p.weight*.8),carbs=Math.max(0,Math.round((calories-protein*4-fat*9)/4));return {calories,protein,fat,carbs}}

function home(){const t=target(),done=state.logs.length,p=state.profile,plan=workoutPlan(),today=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}),now=new Date(),monday=new Date(now);monday.setDate(now.getDate()-(now.getDay()+6)%7);monday.setHours(0,0,0,0);const days=Array.from({length:7},(_,i)=>{const day=new Date(monday);day.setDate(monday.getDate()+i);return {label:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i],done:state.logs.some(x=>{const d=new Date(x.date);return d.toDateString()===day.toDateString()}),today:day.toDateString()===now.toDateString()}});const weekly=state.logs.filter(x=>new Date(x.date)>=monday).length;screen.innerHTML='<div class="row"><div><h2>Today</h2><p>'+safe(today)+'</p></div><span class="week-badge">Week '+plan.week+' of 12</span></div><section class="week-dots">'+days.map(d=>'<div class="week-day"><span class="'+(d.done?'done':d.today?'today':'')+'">'+(d.done?'✓':d.today?'•':'')+'</span><small>'+d.label+'</small></div>').join('')+'</section><section class="workout-feature"><img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=1000&q=85" alt="Gym training photograph" onerror="this.style.display=\'none\'"><div class="workout-feature-shade"><span class="tag">TODAY’S WORKOUT</span><h2>Full Body '+plan.variant+'</h2><p>'+plan.exercises.length+' exercises · '+safe(p.equipment==='home'?'Home':'Gym')+(plan.recovery?' · Recovery':'')+'</p><button class="primary" data-go="train">Start workout →</button></div></section><div class="grid"><section class="card stat-card"><small>Nutrition</small><div class="metric">'+t.calories+' <span>kcal</span></div><small>P '+t.protein+'g · C '+t.carbs+'g · F '+t.fat+'g</small></section><section class="card stat-card"><small>Weight</small><div class="metric">'+(state.weights.length?safe(state.weights[state.weights.length-1].kg):'—')+' <span>kg</span></div><small>'+done+' total workouts</small></section></div><section class="card"><div class="row"><h3>This wee async function ensureExerciseCatalog(){if(exerciseCatalog||libraryLoading)return;libraryLoading=true;try{const response=await fetch('./exercise-catalog.json',{cache:'no-cache'});if(!response.ok)throw Error('Catalogue unavailable');const data=await response.json();if(!Array.isArray(data.exercises)||data.exercises.length!==100||new Set(data.exercises.map(x=>x.id)).size!==100)throw Error('Catalogue validation failed');exerciseCatalog=data.exercises}catch(error){exerciseCatalog=[];console.error('Exercise catalogue:',error)}finally{libraryLoading=false;if(tab==='library')exerciseLibrary()}}

function train(){const p=state.profile,plan=workoutPlan(),draft=state.draft?.variant===plan.variant&&state.draft?.equipment===p.equipment?state.draft:{};screen.innerHTML='<section class="training-header"><div class="training-top"><button data-go="home" aria-label="Back to home">←</button><strong>Workout</strong><button data-action="reset" aria-label="Change training plan" title="Change training plan" class="training-plan-button">Plan</button></div><div class="week-track">'+Array.from({length:12},(_,i)=>'<span class="'+(i+1===plan.week?'current':i+1<plan.week?'past':'')+'">'+(i+1)+'</span>').join('')+'</div><h2>Week '+plan.week+' – Full Body '+plan.variant+'</h2><p>'+(p.equipment==='home'?'⌂ Home':'⌖ Gym')+' program · '+p.days+' days/week</p></section><div class="workout-switch"><button aria-pressed="true">Exercises</button><button data-go="instructions">Instructions</button></div><section class="workout-progress" aria-live="polite"><div class="row"><strong>Session progress</strong><span id="workout-progress-label">'+plan.exercises.reduce((n,x,i)=>n+Array.from({length:x.sets},(_,j)=>draft['sd'+i+'-'+j]?1:0).reduce((a,b)=>a+b,0),0)+' of '+plan.exercises.reduce((n,x)=>n+x.sets,0)+' sets completed</span></div><progress id="workout-progress-bar" max="'+plan.exercises.reduce((n,x)=>n+x.sets,0)+'" value="'+plan.exercises.reduce((n,x,i)=>n+Array.from({length:x.sets},(_,j)=>draft['sd'+i+'-'+j]?1:0).reduce((a,b)=>a+b,0),0)+'"></progress></section><section class="card workout-exercises">'+(plan.recovery?'<p class="note">Recovery week: one fewer set per exercise.</p>':'')+plan.exercises.map((x,i)=>{const prev=lastPerformance(x.name);return '<div class="exercise"><div class="exercise-layout"><div class="exercise-visual"><span class="exercise-number">'+(i+1)+'</span>'+exerciseVisual(x.name)+'</div><div class="exercise-data"><strong>'+safe(x.name)+'</strong><div class="note">'+x.sets+' sets · '+safe(x.reps)+'</div>'+(prev?'<p class="note">Previous: '+safe(prev.reps||prev.prescript function updateRecipe(i){const r=recipes[i],scale=Number(document.querySelector('[data-serving="'+i+'"]')?.value||1),n=nutrition(r.ingredients,scale),grams=Math.round(r.ingredients.reduce((sum,x)=>sum+x[1]*scale,0)),out=document.querySelector('[data-nutrition="'+i+'"]'),list=document.querySelector('[data-ingredients="'+i+'"]');if(out)out.textContent=grams+' g total ingredient weight';const kcal=document.querySelector('[data-kcal="'+i+'"]'),macros=document.querySelector('[data-macros="'+i+'"]');if(kcal)kcal.textContent=n[0]+' kcal';if(macros)macros.textContent='P '+n[1]+' g  ·  C '+n[2]+' g  ·  F '+n[3]+' g';for(const [key,v] of [['protein',n[1]],['carbs',n[2]],['fat',n[3]]]){const el=document.querySelector('[data-'+key+'="'+i+'"]');if(el)el.textContent=v+'g'}if(list)list.innerHTML=r.ingredients.map(([food,g])=>'<li>'+safe(food)+' — '+Math.round(g*scale*10)/10+' g</li>').join('')}

function progress(){const logs=state.logs.slice().reverse(),weights=state.weights.slice().reverse(),recent=logs.slice(0,10),latest=weights[0]?.kg,first=weights[weights.length-1]?.kg,delta=weights.length>1?Math.round((latest-first)*10)/10:null;screen.innerHTML='<h2>Your progress</h2><p>Every session counts.</p><div class="grid"><section class="card"><small>Workouts completed</small><div class="metric">'+logs.length+'</div></section><section class="card"><small>Latest weight</small><div class="metric">'+(latest??'—')+'</div><small>kg</small></section></div><section class="card"><h3>Weight trend</h3>'+(weights.length>1?'<div class="trend-chart" role="img" aria-label="Body weight history chart"><svg viewBox="0 0 320 120" preserveAspectRatio="none"><polyline fill="none" stroke="#0aaf60" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="'+weights.slice().reverse().slice(-24).map((w,i,arr)=>{const vals=arr.map(x=>Number(x.kg)),min=Math.min(...vals)-.5,max=Math.max(...vals)+.5;return (12+i*296/Math.max(1,arr.length-1))+','+(105-(Number(w.kg)-min)/(max-min)*90)}).join(' ')+'"/></svg></div><p class="note">Change since first entry: '+(delta>0?'+':'')+delta+' kg</p>':'<p>Log two weigh-ins to see a trend.</p>')+'</section><section class="card"><h3>Log body weight</h3><form id="weightform"><label>Weight (kg)</label><input name="kg" type="number" step=".1" min="30" max="350" required><button class="primary" style="margin-top:12px">Save weight</button></form></section><section class="card"><h3>Workout history</h3>'+(recent.length?recent.map(x=>'<details class="exercise"><summary>'+new Date(x.date).toLocaleDateString()+' · Workout '+safe(x.variant||'')+' · '+safe(x.type)+'</summary>'+(x.exercises||[]).map(e=>'<p>'+safe(e.name)+' · '+safe(e.sets?.length?e.sets.filter(z=>z.reps).map(z=>z.reps+' × '+(z.kg||'BW')+' kg').join(' / '):e.reps||e.prescription||'—')+'</p>').join('')+'</details>').join(''):'<p>No sessions logged yet.</p>')+'</section><section class="card"><h3>Your data</h3><p class="note">Data is saved in this browser. Download a backup before switching devices.</p><button data-action="export">Download backup</button><label for="restore-file">Restore a backup</label><input id="restore-file" type="file" accept="application/json,.json"><button data-action="restore" style="margin-top:10px">Restore backup</button></section>'}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));if(!state.profile){onboarding();return}({home,train,library:exerciseLibrary,eat,progress,shopping,instructions}[tab]||home)()}
document.addEventListener('submit',e=>{if(e.target.id==='setup'){e.preventDefault();const f=new FormData(e.target);const p={goal:f.get('goal'),level:f.get('level'),equipment:f.get('equipment'),days:Number(f.get('days')),age:Number(f.get('age')),weight:Number(f.get('weight')),height:Number(f.get('height')),sex:f.get('sex')};if(![p.days,p.age,p.weight,p.height].every(Number.isFinite)||p.days<2||p.days>5||p.age<18||p.age>100||p.weight<30||p.weight>350||p.height<120||p.height>230)return;state.profile=p;save();tab='home';render()}if(e.target.id==='weightform'){e.preventDefault();const kg=Number(new FormData(e.target).get('kg'));if(!Number.isFinite(kg)||kg<30||kg>350)return;state.weights.push({date:new Date().toISOString(),kg});save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='recipe-search'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('[data-recipe-card]').forEach(card=>{card.hidden=!card.textContent.toLowerCase().includes(q)})}});
document.addEventListener('input',e=>{if(e.target.id==='library-search'){librarySearch=e.target.value;const caret=e.target.selectionStart;exerciseLibrary();const input=document.getElementById('library-search');if(input){input.focus();input.setSelectionRange(caret,caret)}}});document.addEventListener('change',e=>{if(e.target.id==='library-category'){libraryCategory=e.target.value;exerciseLibrary();return}if(e.target.dataset.shopName!==undefined){state.checkedShopping=state.checkedShopping||{};state.checkedShopping[e.target.dataset.shopName]=e.target.checked;save();return}if(e.target.dataset.serving!==undefined){updateRecipe(Number(e.target.dataset.serving));return}const d=e.target.dataset;let k=null,value=e.target.value;if(d.setReps!==undefined)k='sr'+d.setReps;else if(d.setWeight!==undefined)k='sw'+d.setWeight;else if(d.setDone!==undefined){k='sd'+d.setDone;value=e.target.checked}else if(d.reps!==undefined)k='r'+d.reps;else if(d.load!==undefined)k='w'+d.load;if(k&&state.profile){state.draft=state.draft?.variant===workoutPlan().variant&&state.draft?.equipment===state.profile.equipment?state.draft:{variant:workoutPlan().variant,equipment:state.profile.equipment};state.draft[k]=value;save();if(d.setDone!==undefined)updateWorkoutProgress()}});
document.addEventListener('click',e=>{const lib=e.target.closest('[data-library-id]');if(lib){librarySelected=lib.dataset.libraryId;exerciseLibrary();window.scrollTo(0,0);return}const nav=e.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;render();window.scrollTo(0,0);return}const go=e.target.closest('[data-go]');if(go){tab=go.dataset.go;render();window.scrollTo(0,0);return}const meal=e.target.closest('[data-open-meal]');if(meal){tab='meal';mealDetail(Number(meal.dataset.openMeal));window.scrollTo(0,0);return}const filter=e.target.closest('[data-meal-filter]');if(filter){mealFilter=filter.dataset.mealFilter;document.querySelectorAll('[data-meal-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===filter)));document.querySelectorAll('[data-meal-category]').forEach(el=>el.hidden=mealFilter!=='all'&&el.dataset.mealCategory!==mealFilter);return}const step=e.target.closest('[data-photo-step]');if(step){const frame=step.closest('.exercise-photo-frame'),img=frame?.querySelector('img');if(img){const next=step.dataset.photoStep==='1'?2:1;img.src=img.src.replace(/\/[01]\.jpg(?:\?.*)?$/,'/'+(next-1)+'.jpg');img.alt=img.alt.replace(/starting position|next position/,next===1?'starting position':'next position');step.dataset.photoStep=String(next);step.textContent='Position '+next+' / 2 ↔';step.setAttribute('aria-label','Show '+(next===1?'next':'starting')+' position')}return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='library-back'){librarySelected=null;exerciseLibrary();return}if(action==='reload-library'){exerciseCatalog=null;exerciseLibrary();return}if(action==='finish'){const exercises=workoutPlan().exercises.map((x,i)=>{const sets=Array.from({length:x.sets},(_,j)=>({reps:document.querySelector('[data-set-reps="'+i+'-'+j+'"]')?.value||'',kg:document.querySelector('[data-set-weight="'+i+'-'+j+'"]')?.value||'',done:!!document.querySelector('[data-set-done="'+i+'-'+j+'"]')?.checked}));return {name:x.name,prescription:x.sets+' × '+x.reps,sets:sets.map(z=>z.done?z:{reps:'',kg:'',done:false}),reps:sets.filter(z=>z.done&&z.reps).map(z=>z.reps).join(', '),kg:sets.find(z=>z.done&&z.kg)?.kg||''}});const completedSets=exercises.reduce((n,x)=>n+x.sets.filter(z=>z.done&&z.reps!==''&&Number(z.reps)>0).length,0);if(!completedSets){alert('Enter reps and check off at least one completed set before saving.');return}const incomplete=exercises.reduce((n,x)=>n+x.sets.filter(z=>z.done&&(z.reps===''||Number(z.reps)<=0)).length,0);if(incomplete){alert('Some checked sets have no valid rep count. Add reps or uncheck those sets.');return}const unchecked=exercises.reduce((n,x)=>n+x.sets.filter(z=>z.reps!==''&&!z.done).length,0);if(unchecked&&!confirm(unchecked+' entered set(s) are not checked complete. Save only the checked sets?'))return;state.logs.push({date:new Date().toISOString(),type:state.profile.equipment,variant:workoutPlan().variant,exercises});state.draft={};if(save()){tab='progress';render()}}if(action==='clear-draft'&&confirm('Clear your unfinished workout entries?')){state.draft={};save();render()}if(action==='reset'&&confirm('Change your plan? Your workout and weight history will be kept.')){state.profile=null;state.draft={};save();render()}if(action==='clear-completed'){const checked=state.checkedShopping||{};state.shopping=(state.shopping||[]).filter(x=>!checked[String(x).split(' — ')[0]]);state.checkedShopping={};save();render();return}if(action==='clear-shopping'&&confirm('Clear your entire shopping list?')){state.shopping=[];state.checkedShopping={};save();render()}const recipe=e.target.closest('[data-recipe]');if(recipe){const r=recipes[Number(recipe.dataset.recipe)];if(r){state.shopping=Array.isArray(state.shopping)?state.shopping:[];const scale=Number(document.querySelector('[data-serving="'+recipe.dataset.recipe+'"]')?.value||1);for(const [name,g] of r.ingredients)state.shopping.push(name+' — '+Math.round(g*scale*10)/10+' g');save();tab='shopping';render()}}if(action==='restore'){const file=document.getElementById('restore-file')?.files?.[0];if(!file){alert('Choose a backup JSON file first.');return}if(file.size>2000000){alert('Backup exceeds 2 MB.');return}file.text().then(raw=>{let data;try{data=JSON.parse(raw)}catch(e){throw Error('Invalid JSON backup')}if(!data||typeof data!=='object'||!Array.isArray(data.logs)||!Array.isArray(data.weights)||data.logs.length>10000||data.weights.length>10000||data.profile!==null&&typeof data.profile!=='object')throw Error('Not an EZPZ Fitness backup');if(data.profile){const p=data.profile;if(!['home','gym'].includes(p.equipment)||!['Beginner','Intermediate','Advanced'].includes(p.level)||!Number.isFinite(p.weight)||!Number.isFinite(p.height)||!Number.isFinite(p.age)||!Number.isFinite(p.days)||p.weight<30||p.weight>350||p.height<120||p.height>230||p.age<18||p.age>100||p.days<2||p.days>5)throw Error('Invalid profile in backup')}if(!confirm('Replace all fitness data on this device with this backup?'))return;const prior=state;state={profile:data.profile||null,logs:data.logs,weights:data.weights,shopping:Array.isArray(data.shopping)?data.shopping.slice(0,100):[],draft:{}};if(!save()){state=prior;return}tab='home';render()}).catch(err=>alert('Restore failed: '+err.message));return}if(action==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ezpz-fitness-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
render();
