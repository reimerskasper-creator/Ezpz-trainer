function exerciseEntry(name){const aliases={'DB Romanian Deadlift':'Dumbbell Romanian Deadlift','Floor Press':'Dumbbell Floor Press','Hip Hinge':'Hip Hinge Drill','DB Shoulder Press':'Seated Dumbbell Shoulder Press'};return exerciseCatalog?.find(x=>x.name===(aliases[name]||name))||null}

function previousSetText(previous,index,exercise){const set=previous?.sets?.[index],unit=exercise.unit||'reps',previousUnit=previous?.unit||(/\bsec/.test(previous?.prescription||'')?'sec':'reps');if(!set||set.done===false||!Number.isFinite(Number(set.reps))||Number(set.reps)<=0||unit!==previousUnit)return '—';return unit==='reps'?safe(set.reps)+' × '+(Number(set.kg)>0?safe(set.kg)+' kg':'BW'):safe(set.reps)+' '+unit}

function plannedMeals(){return state.mealPlan&&typeof state.mealPlan==='object'?state.mealPlan:{}}
function mealPlanDay(){const offset=Math.max(0,Math.min(6,Number(state.mealPlanOffset)||0));const d=new Date();d.setDate(d.getDate()+offset);return d.toLocaleDateString('en-CA')}
function planPortion(day,slot){const v=Number(day[slot+'Portion']);return [0.5,1,1.5,2,2.5,3].includes(v)?v:1}
function plannedNutrition(date){const day=plannedMeals()[date]||{},totals=[0,0,0,0];for(const slot of ['breakfast','lunch','dinner']){const i=day[slot];if(Number.isInteger(i)&&recipes[i]){const scale=planPortion(day,slot);for(const [name,grams] of recipes[i].ingredients){foods[name].forEach((v,k)=>totals[k]+=v*grams*scale/100)}}}return totals.map(Math.round)}

let plannerWeek=0,plannerNotice='',builderDraft=null,previewWorkoutId=null;
function validPlanDate(v){if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const d=new Date(v+'T12:00:00');return Number.isFinite(+d)&&d.toLocaleDateString('en-CA')===v}
function datePlus(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')}
function cleanCustomWorkouts(items){return (Array.isArray(items)?items:[]).slice(0,100).filter(w=>w&&/^custom-[a-z0-9-]{1,70}$/.test(w.id)&&typeof w.title==='string'&&w.title.trim()&&['Beginner','Intermediate','Advanced'].includes(w.level)&&['Full Body','Push','Pull','Leg','Arms','Glutes','Core','Mobility','Stability','Cardio','HIIT'].includes(w.category)&&Array.isArray(w.exercises)&&w.exercises.length>0&&w.exercises.length<=30&&w.exercises.every(x=>x&&typeof x.name==='string'&&x.name.trim()&&Number.isInteger(x.sets)&&x.sets>=1&&x.sets<=10&&typeof x.reps==='string'&&x.reps.trim()&&['reps','sec','min'].includes(x.unit)&&Number.isFinite(x.rest)&&x.rest>=0&&x.rest<=600)).map(w=>({...w,title:w.title.slice(0,80),equipment:String(w.equipment||'Your setup').slice(0,160),minutes:String(w.minutes||'Custom').slice(0,20),coverCategory:w.category,programName:w.title.slice(0,80),summary:'Your custom session',guide:'Complete each exercise with controlled technique. Use the listed rest and adjust the load to your ability.',warmup:'5–10 min easy movement and lighter practice sets.',cooldown:'3–5 min easy movement.',exercises:w.exercises.map(x=>({...x,name:x.name.slice(0,100),reps:x.reps.slice(0,30),side:!!x.side}))})).filter((w,i,all)=>all.findIndex(x=>x.id===w.id)===i)}
function allWorkouts(){return [...workoutTemplates,...cleanCustomWorkouts(state.customWorkouts)]}
function knownWorkout(id,custom=state.customWorkouts){return id==='full-body'||workoutTemplates.some(w=>w.id===id)||cleanCustomWorkouts(custom).some(w=>w.id===id)}
function planWorkout(id){if(id==='full-body')return {...workoutPlan('full-body'),exercises:workoutPlan('full-body').exercises.map(x=>({...x,rest:x.rest??60})),category:'Full Body',programName:'Your Rotating Plan',minutes:'30–45',equipment:state.profile.equipment==='home'?'Chair, counter, backpack, band, mat':'Gym · dumbbells, machines, cable',summary:state.profile.equipment==='home'?'Beginner foundations, including chair squats. Sets scale with your profile.':'Foundational gym strength. Sets scale with your profile.'};return allWorkouts().find(w=>w.id===id)||null}
function workoutBadges(w){const level=w.level||(w.id==='full-body'?'Beginner': 'Intermediate'),effort=w.effort||(['HIIT'].includes(w.category)?'Hard intervals':w.category==='Mobility'?'Gentle':'Moderate');return '<div class="program-badges"><span>'+safe(level)+(w.id==='full-body'?' foundations':'')+'</span><span>'+safe(effort)+'</span></div>'}
function planSettings(){const start=validPlanDate(state.plannerStart)?state.plannerStart:foodDate(),days=[1,7,14,21,28].includes(state.plannerDays)?state.plannerDays:7,offset=Math.max(0,Math.min(days-1,Number(state.plannerOffset)||0));return {start,days,offset,date:datePlus(start,offset)}}
function scheduleDays(){const p=planSettings();return Array.from({length:p.days},(_,i)=>datePlus(p.start,i))}
function planDayLabel(date){return new Date(date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function scheduleWorkout(date,id){if(!validPlanDate(date)||id!==''&&id!=='rest'&&!knownWorkout(id))return false;state.workoutSchedule={...(state.workoutSchedule||{})};if(id)state.workoutSchedule[date]=id;else delete state.workoutSchedule[date];return true}

let homeScheduleView='next';

 if(homeScheduleView==='week'){rows=week.map(date=>{const id=state.workoutSchedule?.[date],w=knownWorkout(id)?planWorkout(id):null;return w?upcomingWorkoutRow(w,date,scheduledSessionDone(date,id)):'<button class="upcoming-day" data-home-plan-date="'+date+'"><span aria-hidden="true">'+(id==='rest'?'○':'+')+'</span><span><small>'+safe(planDayLabel(date))+'</small><strong>'+(id==='rest'?'Rest / recovery':'No workout planned')+'</strong></span><b aria-hidden="true">›</b></button>'}).join('')}
 else{rows=upcoming.map(x=>upcomingWorkoutRow(x.workout,x.date)).join('');if(!upcoming.length)rows=upcomingWorkoutRow(planWorkout(activeWorkoutId()),null);const empty=3-(upcoming.length||1);rows+=Array.from({length:empty},(_,i)=>'<button class="upcoming-empty" data-go="planner"><span aria-hidden="true">＋</span><span>Add '+((upcoming.length||1)+i+1===2?'your second':'your third')+' workout</span><b aria-hidden="true">›</b></button>').join('')}
 return '<section class="home-next"><div class="row"><h3>Your next workouts</h3><button class="home-text-link" data-go="planner">Plan '+homeIcon('arrow')+'</button></div><div class="upcoming-tabs"><button data-home-schedule="next" aria-pressed="'+(homeScheduleView==='next')+'">Next 3 workouts</button><button data-home-schedule="week" aria-pressed="'+(homeScheduleView==='week')+'">Next 7 days</button></div><div class="upcoming-list">'+rows+'</div>'+(!upcoming.length&&homeScheduleView==='next'?'<p class="note">Add dates in My plan to see your sessions in order.</p>':'')+'</section>'
}

function migratePracticalHiit(){
 if(Number(state.hiitLayoutVersion)>=3)return false;
 let changed=false;
 for(const old of legacyHiitDefinitions){
  const d=state.workoutDrafts?.[old.id];if(!d||!Object.keys(d).length)continue;
  state.workoutDraftArchives={...(state.workoutDraftArchives||{}),[old.id]:{workout:old,draft:{...d}}};
  const current=workoutTemplates.find(w=>w.id===old.id),mapped={};
  old.exercises.forEach((x,i)=>{const j=current.exercises.findIndex(y=>y.name===x.name);if(j<0)return;for(let n=0;n<Math.min(x.sets,current.exercises[j].sets);n++)for(const prefix of ['sr','sw','sd']){const key=prefix+i+'-'+n;if(Object.prototype.hasOwnProperty.call(d,key))mapped[prefix+j+'-'+n]=d[key]}});
  state.workoutDrafts[old.id]=mapped;changed=true;
 }
 state.hiitLayoutVersion=3;return changed
}

let trainingFocus={};
function trainingKey(plan=workoutPlan()){return plan.id==='full-body'?plan.id+'-'+state.profile.equipment+'-'+plan.variant:plan.id}
function trainingMode(){return state.trainingView==='all'?'all':'focus'}
function validSetValue(value){return value!==''&&value!==null&&value!==undefined&&Number.isFinite(Number(value))&&Number(value)>0}
function trainingStats(plan=workoutPlan()){const d=workoutDraft(plan),exercises=plan.exercises.map((x,i)=>{const done=Array.from({length:x.sets},(_,j)=>d['sd'+i+'-'+j]===true&&validSetValue(d['sr'+i+'-'+j])).filter(Boolean).length;return {done,total:x.sets,complete:done===x.sets}});return {exercises,total:exercises.reduce((n,x)=>n+x.total,0),done:exercises.reduce((n,x)=>n+x.done,0),complete:exercises.filter(x=>x.complete).length}}
function activeTrainingExercise(plan=workoutPlan()){const stats=trainingStats(plan),remembered=trainingFocus[trainingKey(plan)];return Number.isInteger(remembered)&&plan.exercises[remembered]?remembered:Math.max(0,stats.exercises.findIndex(x=>!x.complete))}
function rememberExercise(i){const plan=workoutPlan();if(!Number.isInteger(i)||!plan.exercises[i])return;trainingFocus[trainingKey(plan)]=i}
function focusTrainingExercise(i){const plan=workoutPlan();if(!plan.exercises[i])return;rememberExercise(i);document.querySelectorAll('[data-training-card]').forEach(el=>{el.open=trainingMode()==='all'||Number(el.dataset.trainingCard)===i});document.querySelectorAll('[data-exercise-jump]').forEach(el=>el.setAttribute('aria-current',Number(el.dataset.exerciseJump)===i?'step':'false'));const card=document.getElementById('training-exercise-'+i);card?.scrollIntoView?.({block:'start',behavior:'smooth'});card?.querySelector('summary')?.focus?.({preventScroll:true})}
function previousExerciseSets(x){const previous=lastPerformance(x.name),unit=previous?.unit||(/\bsec/.test(previous?.prescription||'')?'sec':'reps');return unit===(x.unit||'reps')&&Array.isArray(previous?.sets)?previous.sets:[]}
function copyPreviousExercise(index){const plan=workoutPlan(),x=plan.exercises[index];if(!x)return 0;const d={...workoutDraft(plan)},previous=previousExerciseSets(x);let changed=0;for(let j=0;j<x.sets;j++){const old=previous[j];if(!old||old.done===false||!validSetValue(old.reps))continue;const reps='sr'+index+'-'+j,kg='sw'+index+'-'+j;if(d[reps]===undefined||d[reps]===''){d[reps]=String(old.reps);changed++}if(exerciseHasLoad(x)&&(d[kg]===undefined||d[kg]==='')&&old.kg!==''&&old.kg!==undefined&&Number.isFinite(Number(old.kg))&&Number(old.kg)>=0){d[kg]=String(old.kg);changed++}}if(changed)persistTrainingDraft(plan,d);return changed}
function repeatEnteredSet(index){const plan=workoutPlan(),x=plan.exercises[index];if(!x)return false;const d={...workoutDraft(plan)};for(let j=1;j<x.sets;j++){const key='sr'+index+'-'+j;if(d['sd'+index+'-'+j]||validSetValue(d[key]))continue;let previous=j-1;while(previous>=0&&!validSetValue(d['sr'+index+'-'+previous]))previous--;if(previous<0)return false;d[key]=d['sr'+index+'-'+previous];const kg='sw'+index+'-'+j,prior=d['sw'+index+'-'+previous];if((d[kg]===undefined||d[kg]==='')&&prior!==undefined)d[kg]=prior;persistTrainingDraft(plan,d);return true}return false}

function saveOwnWorkout(draft,destination){if(!['plan','train','saved'].includes(destination))return false;const id='custom-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),clean=cleanCustomWorkouts([{...draft,id}])[0];if(!clean){alert('Add a workout name and check each exercise, set count and rep target.');return false}if((state.customWorkouts||[]).length>=100){alert('You have reached 100 custom workouts.');return false}const before={customWorkouts:state.customWorkouts,workoutSchedule:state.workoutSchedule,selectedWorkout:state.selectedWorkout,activePlanDate:state.activePlanDate};state.customWorkouts=[...(state.customWorkouts||[]),clean];if(destination==='plan')scheduleWorkout(planSettings().date,id);if(destination==='train'){state.selectedWorkout=id;delete state.activePlanDate}if(!save()){Object.assign(state,before);return false}builderDraft=null;if(destination==='train'){tab='train';render()}else if(destination==='plan'){plannerNotice='Your workout is saved and added to this day.';tab='planner';render()}else{builderDraft=emptyOwnWorkout();builderSection='saved';tab=builderOrigin==='planner'?'planner':'builder';render()}window.scrollTo(0,0);return id}

 const create=e.target.closest('[data-action="create-my-workout"]'),section=e.target.closest('[data-own-section]'),start=e.target.closest('[data-own-start]');
 if(create){startBuilder(null);return}
 if(section){if(builderSection==='build')builderDraft=captureBuilder();builderSection=section.dataset.ownSection==='saved'?'saved':'build';workoutBuilder();return}
 if(start&&knownWorkout(start.dataset.ownStart)){builderDraft=null;builderSection='build';state.selectedWorkout=start.dataset.ownStart;delete state.activePlanDate;if(save()){tab='train';render();window.scrollTo(0,0)}}
});
