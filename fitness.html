<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b18"><title>EZPZ Fitness</title><style>
:root{font:16px system-ui,-apple-system,sans-serif;color:#eef7f0;background:#101b18}*{box-sizing:border-box}body{max-width:620px;margin:auto;padding:22px 18px 110px}h1{font-size:28px;letter-spacing:-1px;margin:8px 0}h2{font-size:23px;margin:6px 0 16px}h3{margin:0 0 12px}p{line-height:1.5;color:#adc1b7}.muted,small{color:#adc1b7}.card{border:1px solid #30473b;background:#1a2a23;border-radius:20px;padding:20px;margin:14px 0}.hero{background:linear-gradient(135deg,#264b39,#1a2a23)}button,input,select{font:inherit;border-radius:12px;padding:13px;color:#eef7f0;background:#263b30;border:1px solid #456151;width:100%;min-height:48px}button{cursor:pointer;font-weight:700}button.primary{background:#a5edbe;color:#12281b;border:0}label{display:block;font-size:13px;color:#c9d9d0;margin:14px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row button{width:auto}.tag{font-size:12px;color:#a5edbe}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:620px;width:100%;background:#14241c;display:flex;padding:10px 8px max(12px,env(safe-area-inset-bottom));gap:5px;border-top:1px solid #30473b}.nav button{font-size:12px;padding:8px 2px;border:0;background:transparent}.nav button[aria-current="page"]{color:#a5edbe;background:#294736}.exercise{padding:12px 0;border-bottom:1px solid #34483b}.exercise:last-child{border:0}.exercise input{width:75px;min-height:38px;padding:8px}.exercise button{width:auto;min-height:38px;padding:8px}.hidden{display:none}.metric{font-size:25px;font-weight:800}.note{font-size:12px}.link{color:#a5edbe;text-decoration:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a5edbe} </style></head><body>
<header class="row"><div><span class="tag">EZPZ FITNESS · PILOT</span><h1>Fitness made simple.</h1></div><a class="link" href="./index.html">Trainer ↗</a></header>
<main id="screen"></main><nav class="nav" aria-label="Main navigation"><button data-tab="home">⌂<br>Home</button><button data-tab="train">▣<br>Train</button><button data-tab="eat">◉<br>Eat</button><button data-tab="progress">↗<br>Progress</button></nav>
<script>
'use strict';
const KEY='ezpz-fitness-pilot-1',screen=document.getElementById('screen');
const programs={
home:[['Chair Squat','3 × 10'],['Incline Push-up','3 × 8'],['Backpack Row','3 × 12'],['Glute Bridge','3 × 12'],['Dead Bug','3 × 8 / side']],
gym:[['Goblet Squat','3 × 10'],['Machine Chest Press','3 × 10'],['Seated Cable Row','3 × 12'],['DB Romanian Deadlift','3 × 10'],['Farmer Carry','3 × 30 sec']]
};
const recipes=[
{name:'Greek yogurt berry bowl',ingredients:[['Plain nonfat Greek yogurt',250],['Rolled oats',45],['Blueberries',100],['Peanut butter',15]],instructions:'Mix yogurt and oats, top with berries and peanut butter.'},
{name:'Chicken rice bowl',ingredients:[['Cooked chicken breast',150],['Cooked rice',180],['Broccoli',150],['Olive oil',10]],instructions:'Warm the chicken, rice and broccoli. Finish with olive oil and seasoning.'},
{name:'Eggs and toast',ingredients:[['Whole eggs',100],['Whole wheat bread',80],['Banana',120]],instructions:'Cook the eggs, toast the bread, and serve with banana.'},
{name:'Tuna potato bowl',ingredients:[['Tuna in water drained',120],['Boiled potatoes',250],['Tomatoes',120],['Olive oil',10]],instructions:'Combine cooked potatoes, drained tuna and tomatoes. Dress with oil.'},
{name:'Turkey wrap',ingredients:[['Cooked turkey breast',130],['Flour tortilla',70],['Lettuce',50],['Tomatoes',100],['Plain nonfat Greek yogurt',50]],instructions:'Fill the tortilla with turkey and vegetables. Use yogurt as sauce.'},
{name:'Salmon dinner',ingredients:[['Cooked salmon',150],['Boiled potatoes',230],['Broccoli',150]],instructions:'Cook salmon thoroughly and serve with potatoes and broccoli.'}
];
const foods={'Plain nonfat Greek yogurt':[59,10.3,3.6,.4],'Rolled oats':[389,16.9,66.3,6.9],'Blueberries':[57,.7,14.5,.3],'Peanut butter':[588,25,20,50],'Cooked chicken breast':[165,31,0,3.6],'Cooked rice':[130,2.7,28.2,.3],'Broccoli':[35,2.4,7.2,.4],'Olive oil':[884,0,0,100],'Whole eggs':[143,12.6,.7,9.5],'Whole wheat bread':[247,13,41,4.2],'Banana':[89,1.1,22.8,.3],'Tuna in water drained':[116,25.5,0,.8],'Boiled potatoes':[87,1.9,20.1,.1],'Tomatoes':[18,.9,3.9,.2],'Cooked turkey breast':[135,29,0,1],'Flour tortilla':[312,8.3,52.1,8.3],'Lettuce':[15,1.4,2.9,.2],'Cooked salmon':[206,22.1,0,12.4]};
function nutrition(ingredients){return ingredients.reduce((total,[name,g])=>{const n=foods[name]||[0,0,0,0];return total.map((v,i)=>v+n[i]*g/100)},[0,0,0,0]).map(Math.round)}
const meals=recipes.map(r=>[r.name,...nutrition(r.ingredients)]);
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!state||typeof state!=='object')state={profile:null,logs:[],weights:[]};if(!Array.isArray(state.logs))state.logs=[];if(!Array.isArray(state.weights))state.weights=[];
let tab='home';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Unable to save on this device. Check storage settings.');return false}}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]))}
function target(){const p=state.profile;const activity=p.days>=4?1.5:1.35;const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161);const calories=Math.max(1400,Math.round((bmr*activity+(p.goal==='lose'?-350:p.goal==='gain'?200:0))/50)*50);const protein=Math.round(p.weight*1.6),fat=Math.round(p.weight*.8),carbs=Math.max(0,Math.round((calories-protein*4-fat*9)/4));return {calories,protein,fat,carbs}}
function onboarding(){screen.innerHTML='<section class="card hero"><h2>Make it yours</h2><p>Five quick steps to choose your starting plan. You can change this later.</p><form id="setup"><label>Primary goal</label><select name="goal"><option value="lose">Lose fat</option><option value="maintain">Get fitter / maintain</option><option value="gain">Build muscle</option></select><label>Training experience</label><select name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select><label>Where do you train?</label><select name="equipment"><option value="home">At home</option><option value="gym">At a gym</option></select><label>Workout days per week</label><select name="days"><option>2</option><option selected>3</option><option>4</option><option>5</option></select><div class="grid"><div><label>Age (years)</label><input name="age" type="number" min="18" max="100" required placeholder="35"></div><div><label>Weight (kg)</label><input name="weight" type="number" min="30" max="350" step=".1" required placeholder="80"></div><div><label>Height (cm)</label><input name="height" type="number" min="120" max="230" required placeholder="180"></div><div><label>For calorie estimate</label><select name="sex"><option value="male">Male formula</option><option value="female">Female formula</option></select></div></div><button class="primary" style="margin-top:20px">Create my plan →</button></form><p class="note">Estimates are general starting points for adults, not medical advice. Data stays in this browser during the pilot.</p></section>'}
function home(){const t=target(),done=state.logs.length;screen.innerHTML='<section class="card hero"><span class="tag">YOUR PLAN</span><h2>Ready for today?</h2><p>'+safe(state.profile.level)+' · '+safe(state.profile.days)+' days/week · '+(state.profile.equipment==='home'?'Home':'Gym')+'</p><button class="primary" data-go="train">Start workout →</button></section><div class="grid"><section class="card"><small>Daily calories</small><div class="metric">'+t.calories+'</div><small>kcal estimate</small></section><section class="card"><small>Sessions logged</small><div class="metric">'+done+'</div><small>total</small></section></div><section class="card"><h3>Keep it simple</h3><p>Train consistently. Eat enough protein. Track your progress. Adjust based on results.</p><button data-go="eat">See nutrition targets →</button></section><button data-action="reset">Change my plan</button>'}
const alternate={
home:[['Reverse Lunge','3 × 8 / side'],['Floor Press','3 × 10'],['Resistance Band Row','3 × 12'],['Hip Hinge','3 × 12'],['Side Plank','3 × 25 sec']],
gym:[['Leg Press','3 × 10'],['Lat Pulldown','3 × 10'],['DB Shoulder Press','3 × 10'],['Hip Thrust','3 × 12'],['Pallof Press','3 × 12 / side']]
};
function workoutPlan(){const p=state.profile,done=state.logs.filter(x=>x.type===p.equipment).length,variant=done%2===0?'A':'B',base=variant==='A'?programs[p.equipment]:alternate[p.equipment],week=Math.floor(done/Math.max(1,p.days))%12+1,recovery=week%4===0;return {week,variant,recovery,exercises:base.map((x,i)=>({name:x[0],sets:Math.max(1,(p.level==='Beginner'?2:p.level==='Advanced'?4:3)-(recovery?1:0)),reps:x[1].split('×')[1]?.trim()||'10',index:i}))}}
function lastPerformance(name){for(let i=state.logs.length-1;i>=0;i--){const found=state.logs[i].exercises?.find(e=>e.name===name);if(found)return found}return null}
function train(){const p=state.profile,plan=workoutPlan(),draft=state.draft?.variant===plan.variant&&state.draft?.equipment===p.equipment?state.draft:{};screen.innerHTML='<div class="row"><div><h2>Workout '+plan.variant+'</h2><p>Week '+plan.week+' of 12 · '+safe(p.equipment==='home'?'Home':'Gym')+' · '+safe(p.level)+'</p></div><span class="tag">'+p.days+' days/week</span></div><section class="card hero"><h3>'+(plan.recovery?'Recovery week':'Build strength gradually')+'</h3><p>'+(plan.recovery?'This week uses one fewer set per exercise. Keep the movements comfortable and focus on technique.':'Try to improve technique or add a rep before increasing weight. Rest between sessions as needed.')+'</p></section><section class="card"><p class="note">Record completed reps and weight. Previous entries are shown to help you progress.</p>'+plan.exercises.map((x,i)=>{const prev=lastPerformance(x.name);return '<div class="exercise"><div class="row"><strong>'+safe(x.name)+'</strong><span class="tag">'+x.sets+' sets · '+safe(x.reps)+'</span></div>'+(prev?'<small>Last: '+safe(prev.reps||prev.prescription||'—')+' reps · '+safe(prev.kg||'bodyweight')+' kg</small>':'<small>First time doing this exercise</small>')+'<div class="grid"><div><label>Reps completed</label><input data-reps="'+i+'" type="text" maxlength="50" placeholder="10, 10, 10" value="'+safe(draft['r'+i]||'')+'"></div><div><label>Weight (kg)</label><input data-load="'+i+'" inputmode="decimal" type="number" min="0" max="1000" step=".5" value="'+safe(draft['w'+i]||'')+'" placeholder="Bodyweight"></div></div></div>'}).join('')+'</section><button class="primary" data-action="finish">Complete workout ✓</button><button data-action="clear-draft" style="margin-top:10px">Clear workout entries</button><p class="note">Your entries are stored on this device. Stop if you experience pain, dizziness or unusual symptoms.</p>'}
function eat(){const t=target();screen.innerHTML='<h2>Eat simply</h2><p>Daily starting targets based on your onboarding details.</p><section class="card hero"><small>Daily calorie estimate</small><div class="metric">'+t.calories+' kcal</div><div class="grid"><p><strong>'+t.protein+' g</strong><br>Protein</p><p><strong>'+t.carbs+' g</strong><br>Carbs</p><p><strong>'+t.fat+' g</strong><br>Fat</p></div><p class="note">Estimates, not prescriptions. Needs vary with activity, medical conditions and goals.</p></section><h3>Recipes and shopping list</h3>'+recipes.map((r,i)=>{const n=nutrition(r.ingredients);return '<section class="card" data-recipe-card><h3>'+safe(r.name)+'</h3><p>'+n[0]+' kcal · '+n[1]+' g protein · '+n[2]+' g carbs · '+n[3]+' g fat</p><details><summary>Ingredients & method</summary><ul>'+r.ingredients.map(([food,g])=>'<li>'+safe(food)+' — '+g+' g</li>').join('')+'</ul><p>'+safe(r.instructions)+'</p></details><button data-recipe="'+i+'">Add to shopping list</button></section>'}).join('')+'<section class="card"><h3>Shopping list</h3><div id="shopping">'+(state.shopping||[]).map(x=>'<p>'+safe(x)+'</p>').join('')+'</div><button data-action="clear-shopping">Clear list</button></section><p class="note">Nutrition values are approximate reference values per 100 g. Check packaging and actual portions.</p>'}
function progress(){const logs=state.logs.slice().reverse(),weights=state.weights.slice().reverse(),recent=logs.slice(0,10);screen.innerHTML='<h2>Your progress</h2><div class="grid"><section class="card"><small>Workouts</small><div class="metric">'+logs.length+'</div></section><section class="card"><small>Latest weight</small><div class="metric">'+(weights.length?safe(weights[0].kg):'—')+'</div><small>kg</small></section></div><section class="card"><h3>Log body weight</h3><form id="weightform"><label>Weight (kg)</label><input name="kg" type="number" step=".1" min="30" max="350" required><button class="primary" style="margin-top:12px">Save weight</button></form></section><section class="card"><h3>Workout history</h3>'+(recent.length?recent.map(x=>'<details class="exercise"><summary>'+new Date(x.date).toLocaleDateString()+' · Workout '+safe(x.variant||'')+' · '+safe(x.type)+'</summary>'+(x.exercises||[]).map(e=>'<p>'+safe(e.name)+' · '+safe(e.reps||e.prescription||'—')+' reps · '+safe(e.kg||'bodyweight')+' kg</p>').join('')+'</details>').join(''):'<p>No sessions logged yet.</p>')+'</section><section class="card"><h3>Weight history</h3>'+(weights.length?weights.slice(0,10).map(x=>'<p>'+new Date(x.date).toLocaleDateString()+' · '+safe(x.kg)+' kg</p>').join(''):'<p>No weigh-ins yet.</p>')+'</section><section class="card"><h3>Your data</h3><p class="note">Data is saved only in this browser. Back up before switching devices.</p><button data-action="export">Download backup</button><label for="restore-file">Restore a backup</label><input id="restore-file" type="file" accept="application/json,.json"><button data-action="restore" style="margin-top:10px">Restore backup</button></section>'}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));if(!state.profile){onboarding();return}({home,train,eat,progress}[tab]||home)()}
document.addEventListener('submit',e=>{if(e.target.id==='setup'){e.preventDefault();const f=new FormData(e.target);const p={goal:f.get('goal'),level:f.get('level'),equipment:f.get('equipment'),days:Number(f.get('days')),age:Number(f.get('age')),weight:Number(f.get('weight')),height:Number(f.get('height')),sex:f.get('sex')};if(![p.days,p.age,p.weight,p.height].every(Number.isFinite)||p.days<2||p.days>5||p.age<18||p.age>100||p.weight<30||p.weight>350||p.height<120||p.height>230)return;state.profile=p;save();tab='home';render()}if(e.target.id==='weightform'){e.preventDefault();const kg=Number(new FormData(e.target).get('kg'));if(!Number.isFinite(kg)||kg<30||kg>350)return;state.weights.push({date:new Date().toISOString(),kg});save();render()}});
document.addEventListener('input',e=>{if(e.target.id==='recipe-search'){const q=e.target.value.toLowerCase().trim();document.querySelectorAll('[data-recipe-card]').forEach(card=>{card.hidden=!card.textContent.toLowerCase().includes(q)})}});
document.addEventListener('change',e=>{const k=e.target.dataset.reps!==undefined?'r'+e.target.dataset.reps:e.target.dataset.load!==undefined?'w'+e.target.dataset.load:null;if(k){state.draft=state.draft?.variant===workoutPlan().variant&&state.draft?.equipment===state.profile.equipment?state.draft:{variant:workoutPlan().variant,equipment:state.profile.equipment};state.draft[k]=e.target.value;save()}});
document.addEventListener('click',e=>{const nav=e.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;render();window.scrollTo(0,0);return}const go=e.target.closest('[data-go]');if(go){tab=go.dataset.go;render();return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='finish'){const exercises=workoutPlan().exercises.map((x,i)=>({name:x.name,prescription:x.sets+' × '+x.reps,reps:(document.querySelector('[data-reps="'+i+'"]')?.value||'').trim(),kg:document.querySelector('[data-load="'+i+'"]')?.value||''}));if(!exercises.some(x=>x.reps)){alert('Log at least one exercise before completing your workout.');return}state.logs.push({date:new Date().toISOString(),type:state.profile.equipment,variant:workoutPlan().variant,exercises});state.draft={};if(save()){tab='progress';render()}}if(action==='clear-draft'&&confirm('Clear your unfinished workout entries?')){state.draft={};save();render()}if(action==='reset'&&confirm('Change your plan? Your workout and weight history will be kept.')){state.profile=null;state.draft={};save();render()}if(action==='clear-shopping'){state.shopping=[];save();render()}const recipe=e.target.closest('[data-recipe]');if(recipe){const r=recipes[Number(recipe.dataset.recipe)];if(r){state.shopping=Array.isArray(state.shopping)?state.shopping:[];for(const [name,g] of r.ingredients)state.shopping.push(name+' — '+g+' g');save();render()}}if(action==='restore'){const file=document.getElementById('restore-file')?.files?.[0];if(!file){alert('Choose a backup JSON file first.');return}if(file.size>2000000){alert('Backup exceeds 2 MB.');return}file.text().then(raw=>{let data;try{data=JSON.parse(raw)}catch(e){throw Error('Invalid JSON backup')}if(!data||typeof data!=='object'||!Array.isArray(data.logs)||!Array.isArray(data.weights)||data.logs.length>10000||data.weights.length>10000||data.profile!==null&&typeof data.profile!=='object')throw Error('Not an EZPZ Fitness backup');if(data.profile){const p=data.profile;if(!['home','gym'].includes(p.equipment)||!['Beginner','Intermediate','Advanced'].includes(p.level)||!Number.isFinite(p.weight)||!Number.isFinite(p.height)||!Number.isFinite(p.age)||!Number.isFinite(p.days)||p.weight<30||p.weight>350||p.height<120||p.height>230||p.age<18||p.age>100||p.days<2||p.days>5)throw Error('Invalid profile in backup')}if(!confirm('Replace all fitness data on this device with this backup?'))return;const prior=state;state={profile:data.profile||null,logs:data.logs,weights:data.weights,shopping:Array.isArray(data.shopping)?data.shopping.slice(0,100):[],draft:{}};if(!save()){state=prior;return}tab='home';render()}).catch(err=>alert('Restore failed: '+err.message));return}if(action==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ezpz-fitness-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
render();
</script></body></html>
