<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b18"><title>EZPZ Fitness</title><style>
:root{font:16px system-ui,-apple-system,sans-serif;color:#eef7f0;background:#101b18}*{box-sizing:border-box}body{max-width:620px;margin:auto;padding:22px 18px 110px}h1{font-size:28px;letter-spacing:-1px;margin:8px 0}h2{font-size:23px;margin:6px 0 16px}h3{margin:0 0 12px}p{line-height:1.5;color:#adc1b7}.muted,small{color:#adc1b7}.card{border:1px solid #30473b;background:#1a2a23;border-radius:20px;padding:20px;margin:14px 0}.hero{background:linear-gradient(135deg,#264b39,#1a2a23)}button,input,select{font:inherit;border-radius:12px;padding:13px;color:#eef7f0;background:#263b30;border:1px solid #456151;width:100%;min-height:48px}button{cursor:pointer;font-weight:700}button.primary{background:#a5edbe;color:#12281b;border:0}label{display:block;font-size:13px;color:#c9d9d0;margin:14px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.row button{width:auto}.tag{font-size:12px;color:#a5edbe}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:620px;width:100%;background:#14241c;display:flex;padding:10px 8px max(12px,env(safe-area-inset-bottom));gap:5px;border-top:1px solid #30473b}.nav button{font-size:12px;padding:8px 2px;border:0;background:transparent}.nav button[aria-current="page"]{color:#a5edbe;background:#294736}.exercise{padding:12px 0;border-bottom:1px solid #34483b}.exercise:last-child{border:0}.exercise input{width:75px;min-height:38px;padding:8px}.exercise button{width:auto;min-height:38px;padding:8px}.hidden{display:none}.metric{font-size:25px;font-weight:800}.note{font-size:12px}.link{color:#a5edbe;text-decoration:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a5edbe} </style></head><body>
<header class="row"><div><span class="tag">EZPZ FITNESS · PILOT</span><h1>Fitness made simple.</h1></div><a class="link" href="./index.html">Trainer ↗</a></header>
<main id="screen"></main><nav class="nav" aria-label="Main navigation"><button data-tab="home">⌂<br>Home</button><button data-tab="train">▣<br>Train</button><button data-tab="eat">◉<br>Eat</button><button data-tab="progress">↗<br>Progress</button></nav>
<script>
'use strict';
const KEY='ezpz-fitness-pilot-1',screen=document.getElementById('screen');
const programs={
home:[['Chair Squat','3 × 10'],['Incline Push-up','3 × 8'],['Backpack Row','3 × 12'],['Glute Bridge','3 × 12'],['Dead Bug','3 × 8 / side']],
gym:[['Goblet Squat','3 × 10'],['Machine Chest Press','3 × 10'],['Seated Cable Row','3 × 12'],['DB Romanian Deadlift','3 × 10'],['Farmer Carry','3 × 30 sec']]
};
const meals=[['Greek yogurt, berries & oats',420,32],['Eggs, toast & fruit',480,28],['Chicken rice bowl',610,48],['Tuna potato salad',520,42],['Turkey wrap',550,45],['Salmon, potatoes & vegetables',650,43]];
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!state||typeof state!=='object')state={profile:null,logs:[],weights:[]};
let tab='home';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Unable to save on this device. Check storage settings.');return false}}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':'&#39;'}[c]))}
function target(){const p=state.profile;const activity=p.days>=4?1.5:1.35;const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161);const calories=Math.max(1200,Math.round((bmr*activity+(p.goal==='lose'?-350:p.goal==='gain'?200:0))/50)*50);const protein=Math.round(p.weight*1.6),fat=Math.round(p.weight*.8),carbs=Math.max(0,Math.round((calories-protein*4-fat*9)/4));return {calories,protein,fat,carbs}}
function onboarding(){screen.innerHTML='<section class="card hero"><h2>Make it yours</h2><p>Five quick steps to choose your starting plan. You can change this later.</p><form id="setup"><label>Primary goal</label><select name="goal"><option value="lose">Lose fat</option><option value="maintain">Get fitter / maintain</option><option value="gain">Build muscle</option></select><label>Training experience</label><select name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select><label>Where do you train?</label><select name="equipment"><option value="home">At home</option><option value="gym">At a gym</option></select><label>Workout days per week</label><select name="days"><option>2</option><option selected>3</option><option>4</option><option>5</option></select><div class="grid"><div><label>Age (years)</label><input name="age" type="number" min="18" max="100" required placeholder="35"></div><div><label>Weight (kg)</label><input name="weight" type="number" min="30" max="350" step=".1" required placeholder="80"></div><div><label>Height (cm)</label><input name="height" type="number" min="120" max="230" required placeholder="180"></div><div><label>For calorie estimate</label><select name="sex"><option value="male">Male formula</option><option value="female">Female formula</option></select></div></div><button class="primary" style="margin-top:20px">Create my plan →</button></form><p class="note">Estimates are general starting points for adults, not medical advice. Data stays in this browser during the pilot.</p></section>'}
function home(){const t=target(),done=state.logs.length;screen.innerHTML='<section class="card hero"><span class="tag">YOUR PLAN</span><h2>Ready for today?</h2><p>'+safe(state.profile.level)+' · '+safe(state.profile.days)+' days/week · '+(state.profile.equipment==='home'?'Home':'Gym')+'</p><button class="primary" data-go="train">Start workout →</button></section><div class="grid"><section class="card"><small>Daily calories</small><div class="metric">'+t.calories+'</div><small>kcal estimate</small></section><section class="card"><small>Sessions logged</small><div class="metric">'+done+'</div><small>total</small></section></div><section class="card"><h3>Keep it simple</h3><p>Train consistently. Eat enough protein. Track your progress. Adjust based on results.</p><button data-go="eat">See nutrition targets →</button></section><button data-action="reset">Change my plan</button>'}
function train(){const p=state.profile;const list=programs[p.equipment];screen.innerHTML='<h2>Your workout</h2><p>'+safe(p.equipment==='home'?'Full-body home workout':'Full-body gym workout')+' · '+safe(p.level)+' · Repeat '+p.days+' days/week with rest as needed.</p><section class="card">'+list.map((x,i)=>'<div class="exercise"><div class="row"><strong>'+safe(x[0])+'</strong><span class="tag">'+safe(x[1])+'</span></div><label>Weight used (kg, optional)</label><input inputmode="decimal" type="number" min="0" max="1000" step=".5" data-load="'+i+'" placeholder="—"></div>').join('')+'</section><button class="primary" data-action="finish">Complete workout ✓</button><p class="note">Choose a comfortable range of motion and stop if an exercise causes pain. These are starter workouts, not individualized rehabilitation plans.</p>'}
function eat(){const t=target();screen.innerHTML='<h2>Eat simply</h2><p>Daily starting targets based on your onboarding details.</p><section class="card hero"><small>Daily calorie estimate</small><div class="metric">'+t.calories+' kcal</div><div class="grid"><p><strong>'+t.protein+' g</strong><br>Protein</p><p><strong>'+t.carbs+' g</strong><br>Carbs</p><p><strong>'+t.fat+' g</strong><br>Fat</p></div><p class="note">Activity and energy needs vary. Adjust using your weight trend and how you feel.</p></section><h3>Easy meal ideas</h3>'+meals.map(m=>'<section class="card"><div class="row"><strong>'+safe(m[0])+'</strong><span class="tag">'+m[1]+' kcal</span></div><small>About '+m[2]+' g protein · illustrative estimates</small></section>').join('')}
function progress(){const logs=state.logs.slice().reverse(),weights=state.weights.slice().reverse();screen.innerHTML='<h2>Your progress</h2><div class="grid"><section class="card"><small>Workouts</small><div class="metric">'+logs.length+'</div></section><section class="card"><small>Latest weight</small><div class="metric">'+(weights.length?safe(weights[0].kg):'—')+'</div><small>kg</small></section></div><section class="card"><h3>Log body weight</h3><form id="weightform"><label>Weight (kg)</label><input name="kg" type="number" step=".1" min="30" max="350" required><button class="primary" style="margin-top:12px">Save weight</button></form></section><section class="card"><h3>Recent workouts</h3>'+(logs.length?logs.slice(0,10).map(x=>'<p>'+new Date(x.date).toLocaleDateString()+' · '+safe(x.type)+' · '+x.exercises.length+' exercises</p>').join(''):'<p>No sessions logged yet.</p>')+'</section><section class="card"><h3>Weight history</h3>'+(weights.length?weights.slice(0,10).map(x=>'<p>'+new Date(x.date).toLocaleDateString()+' · '+safe(x.kg)+' kg</p>').join(''):'<p>No weigh-ins yet.</p>')+'</section><button data-action="export">Export my data</button>'}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));if(!state.profile){onboarding();return}({home,train,eat,progress}[tab]||home)()}
document.addEventListener('submit',e=>{if(e.target.id==='setup'){e.preventDefault();const f=new FormData(e.target);const p={goal:f.get('goal'),level:f.get('level'),equipment:f.get('equipment'),days:Number(f.get('days')),age:Number(f.get('age')),weight:Number(f.get('weight')),height:Number(f.get('height')),sex:f.get('sex')};if(![p.days,p.age,p.weight,p.height].every(Number.isFinite))return;state.profile=p;save();tab='home';render()}if(e.target.id==='weightform'){e.preventDefault();const kg=Number(new FormData(e.target).get('kg'));if(kg<30||kg>350)return;state.weights.push({date:new Date().toISOString(),kg});save();render()}});
document.addEventListener('click',e=>{const nav=e.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;render();window.scrollTo(0,0);return}const go=e.target.closest('[data-go]');if(go){tab=go.dataset.go;render();return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='finish'){const exercises=programs[state.profile.equipment].map((x,i)=>({name:x[0],prescription:x[1],kg:document.querySelector('[data-load="'+i+'"]')?.value||''}));state.logs.push({date:new Date().toISOString(),type:state.profile.equipment,exercises});if(save()){tab='progress';render()}}if(action==='reset'&&confirm('Change your plan? Your workout and weight history will be kept.')){state.profile=null;save();render()}if(action==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ezpz-fitness-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
render();
</script></body></html>
