name: On-device label reader
on:
  push:
    branches: [android-health-connect]
    paths: ['native/android/app/src/main/java/com/ezpz/fitness/LabelReaderPlugin.java', 'native/android/app/src/androidTest/**', 'native/android/app/build.gradle', '.github/workflows/label-reader.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Package canonical app
        working-directory: native
        run: npm ci --no-audit --no-fund && npm run sync
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real bundled OCR on generated labels
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            cd native/android && chmod +x gradlew && ./gradlew :app:connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=com.ezpz.fitness.LabelReaderOcrTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Label-reader-OCR-results
          path: native/android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14
