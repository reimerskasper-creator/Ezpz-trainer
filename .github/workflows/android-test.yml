name: Android Health Connect test
on:
  push:
    branches: [android-health-connect]
    # Test and documentation follow-ups can reuse the existing APK. Workflow edits trigger a build.
    paths-ignore: ['tests/**', 'native/android/app/src/androidTest/**', '.github/workflows/label-reader.yml', 'docs/**', 'PROJECT_STATUS.md', 'AGENTS.md']
  pull_request:
    branches: [android-health-connect]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EZPZ_TEST_KEYSTORE: ${{ github.workspace }}/native/.test-signing/debug.keystore
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Validate import contracts
        run: |
          node tests/home-simplified.cjs
          node tests/wellness.cjs
          node tests/native-health.cjs
          node tests/nutrition-import.cjs
          node tests/package-labels.cjs
          node tests/food-macro-ring.cjs
          node tests/accounts.cjs
          node tests/native-accounts.cjs
          node tests/whoop-auto.cjs
          node tests/whoop-connect.mjs
          node tests/whoop-mapping.mjs
          node tests/whoop-sync.mjs
          node tests/whoop-import.cjs
      - name: Package current canonical app
        working-directory: native
        run: |
          npm ci --no-audit --no-fund
          npm run sync
      - name: Verify packaged app startup with actual Capacitor scripts
        run: |
          node tests/native-runtime.cjs
          node tests/barcode.cjs
          node tests/ingredients.cjs
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --only-shell chromium
          node tests/progress-context-mobile.cjs
          node tests/flexible-day.cjs
          node tests/day-card-polish-mobile.cjs
          node tests/flexible-day-mobile.cjs
          node tests/saved-workout-planning-mobile.cjs
          node tests/plan-library.cjs
          node tests/plan-packages.cjs
          node tests/plan-packages-mobile.cjs
          node tests/clear-plan-mobile.cjs
          node tests/plan-library-mobile.cjs
          node tests/review-polish-mobile.cjs
          node tests/compact-workout-screen-mobile.cjs
          node tests/trainer-space.cjs
          node tests/trainer-space-mobile.cjs
          node tests/app-appearance.cjs
          node tests/app-appearance-mobile.cjs
          node tests/progress-card-photos-mobile.cjs
          node tests/home-workout-banner-mobile.cjs
          node tests/home-simplified-mobile.cjs
          node tests/home-appearance-mobile.cjs
          node tests/home-banner-mobile.cjs
          node tests/home-arrange-mobile.cjs
          node tests/food-flow-design-mobile.cjs
          node tests/scanned-food-details-mobile.cjs
          node tests/food-macro-ring-mobile.cjs
          node tests/photo-food-flow-mobile.cjs
          node tests/barcode-mobile.cjs
          node tests/package-labels-mobile.cjs
          node tests/ingredients-mobile.cjs
          node tests/method-guide-mobile.cjs
          node tests/foundation-week-mobile.cjs
          node tests/zone-space-mobile.cjs
          node tests/wellness-mobile.cjs
          node tests/native-package-mobile.cjs
          node tests/whoop-mobile.cjs
          node tests/release-readiness-mobile.cjs
      - uses: actions/cache/restore@v4
        with:
          path: native/.test-signing/debug.keystore
          key: ezpz-fitness-debug-signing-v2
      - name: Require existing Android signing key
        run: |
          test -f "$EZPZ_TEST_KEYSTORE" || { echo 'Existing Android signing key unavailable'; exit 1; }
          keytool -exportcert -keystore "$EZPZ_TEST_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | grep -q '^aff9b047133e210e827b62dcaedc49e40a2ae2248cea0e89656fa7ca8b918a65 '
      - name: Build and test Android
        working-directory: native/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EZPZ-Fitness-Android-test
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-startup-review
          path: |
            test-results/day-card-polish*.jpg
            test-results/flexible-day-*.jpg
            test-results/plan-*.jpg
            test-results/clear-plan-*.jpg
            test-results/plan-library*.jpg
            test-results/compact-workout*.jpg
            test-results/trainer-space*.jpg
            test-results/app-appearance*.jpg
            test-results/photo-food*.jpg
            test-results/barcode-scanner.jpg
            test-results/food-macro-ring-*.jpg
            test-results/home-workout-banner-*.jpg
            test-results/home-simplified*.jpg
            test-results/home-appearance*.jpg
            test-results/home-banner*.jpg
            test-results/progress-card*.jpg
            test-results/method-guide-*.jpg
            test-results/native-package-startup.jpg
            test-results/native-step-check.jpg
            test-results/native-step-period.jpg
            test-results/native-calorie-check.jpg
            test-results/native-backup-save.jpg
            test-results/whoop-direct-*.jpg
            test-results/steps-card-*.jpg
          if-no-files-found: ignore
          retention-days: 14

