name: Mobile app checks
on:
  push:
    branches: [main]
    paths: ['fitness.html', 'exercise-catalog.json', 'meal-images/**', 'workout-images/**', 'tests/**', '.github/workflows/mobile-checks.yml']
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run app and mobile checks
        env:
          EZPZ_VISUAL_LOG: ${{ contains(github.event.head_commit.message, '[visual-review]') && '1' || '0' }}
        run: |
          node tests/units.cjs
          node tests/daily-use.cjs
          node tests/privacy.cjs
          node tests/habits.cjs
          node tests/sleep.cjs
          node tests/home.cjs
          node tests/recipes.cjs
          node tests/custom-foods.cjs
          node tests/nutrition-targets.cjs
          node tests/app-review.cjs
          node tests/workout-photos.cjs
          node tests/planning.cjs
          node tests/training.cjs
          node tests/planner-picker.cjs
          node tests/own-workouts.cjs
          node tests/mobile.cjs
      - name: Save mobile screenshots and results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots
          path: test-results/
          retention-days: 14


