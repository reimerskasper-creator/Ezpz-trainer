name: Mobile app checks
on:
  push:
    branches: [main, android-health-connect]
    paths: ['fitness.html', 'fitness-app/**', 'fitness-sw.js', 'exercise-catalog.json', 'meal-images/**', 'workout-images/**', 'program-images/**', 'tests/**', '.github/workflows/mobile-checks.yml']
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mobile:
    # This owned Android branch already runs the same suite on push.
    if: github.event_name != 'pull_request' || github.head_ref != 'android-health-connect' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --only-shell chromium
      - name: Verify approved Zone activities and reflections
        run: node tests/zone.cjs && node tests/zone-space-mobile.cjs
      - name: Save Zone design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zone-design-review
          path: test-results/zone-space*.jpg
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify independent category photos and approved progress design
        run: node tests/progress-design-mobile.cjs
      - name: Verify sleep overview and pillar Progress
        run: |
          failed=0
          for check in tests/sleep-overview.cjs tests/sleep-overview-mobile.cjs tests/home-burned-mobile.cjs tests/progress-context-mobile.cjs tests/clarity-dialogs-mobile.cjs tests/rest-overhaul-mobile.cjs tests/foundation-week-mobile.cjs; do
            node "$check" || failed=1
          done
          exit "$failed"
      - name: Save Sleep design review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sleep-design-review
          path: |
            test-results/sleep-mood*.jpg
            test-results/sleep-overview-samsung-390.jpg
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify Home section arrangement
        run: node tests/home-arrange-mobile.cjs
      - name: Save Home arrangement review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Home-arrange-review
          path: test-results/home-arrange*.jpg
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify compact Home layout
        run: node tests/personal-home-mobile.cjs
      - name: Run app and mobile checks
        env:
          EZPZ_VISUAL_LOG: ${{ contains(github.event.head_commit.message, '[visual-review]') && '1' || '0' }}
        run: |
          failed=0
          for check in tests/home-background-mobile.cjs tests/tracker-refresh-mobile.cjs tests/workout-brand-mobile.cjs tests/connections-design-mobile.cjs tests/eat-hybrid-mobile.cjs tests/nutrition-import.cjs tests/nutrition-import-mobile.cjs tests/planner-custom-meals-mobile.cjs tests/saved-workouts-mobile.cjs tests/personal-photos.cjs tests/personal-photos-mobile.cjs tests/clarity-dialogs.cjs tests/home-panels.cjs tests/home-panels-mobile.cjs tests/rest-overhaul.cjs tests/header-food-plan-mobile.cjs tests/home-logging.cjs tests/home-logging-mobile.cjs tests/compact-panels-mobile.cjs tests/forest-theme-mobile.cjs tests/habit-trends.cjs tests/habit-trends-mobile.cjs tests/photo-calendar-mobile.cjs tests/accounts.cjs tests/native-accounts.cjs tests/whoop-auto.cjs tests/whoop-import.cjs tests/whoop-mobile.cjs tests/account-deletion.cjs tests/release-readiness.cjs tests/release-readiness-mobile.cjs tests/compact-training-mobile.cjs tests/wellness.cjs tests/native-health.cjs tests/native-health-mobile.cjs tests/wellness-mobile.cjs tests/pillar-pages.cjs tests/foundation-week.cjs tests/branding-mobile.cjs tests/swipe-mobile.cjs tests/daily-refinement.cjs tests/daily-refinement-mobile.cjs tests/personal-welcome.cjs tests/training-usability.cjs tests/units.cjs tests/daily-use.cjs tests/privacy.cjs tests/habits.cjs tests/sleep.cjs tests/zone.cjs tests/overall.cjs tests/home.cjs tests/recipes.cjs tests/custom-foods.cjs tests/nutrition-targets.cjs tests/app-review.cjs tests/workout-photos.cjs tests/planning.cjs tests/training.cjs tests/planner-picker.cjs tests/own-workouts.cjs tests/mobile.cjs; do
            node "$check" || failed=1
          done
          exit "$failed"
      - name: Save mobile screenshots and results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-screenshots
          path: test-results/
          retention-days: 14



